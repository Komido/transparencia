name: Resumir Bolsa Família e BPC por cidade (Portal da Transparência)

# Busca na API do Portal da Transparência quanto foi pago de Novo Bolsa
# Família e de BPC em cada uma das 5.570 cidades, mês a mês
# (scripts/beneficios_para_json.py), e monta os arquivos que o site lê em
# site/dados/beneficios/. Nada passa pelo banco.
#
# A API exige chave gratuita, guardada no secret PORTAL_TRANSPARENCIA_CHAVE.
# O script faz no máximo cerca de 200 pedidos por minuto, metade do limite do
# Portal, e para depois de 5 horas; o que faltar fica para a próxima execução.
# Cada mês leva cerca de 1 hora. Os meses completos são gravados mesmo se um
# mês depois falhar.
#
# Quem dispara é o agendador do banco (pg_cron, etl.disparar_github), de
# madrugada; ver supabase/migrations/20261117010000_disparo_beneficios.sql.

on:
  workflow_dispatch:
    inputs:
      meses:
        description: "Meses AAAA-MM separados por vírgula (vazio: automático)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: beneficios
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Buscar os meses que faltam
        env:
          PORTAL_TRANSPARENCIA_CHAVE: ${{ secrets.PORTAL_TRANSPARENCIA_CHAVE }}
          MESES: ${{ github.event.inputs.meses }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ -n "${MESES:-}" ]; then
            [[ "$MESES" =~ ^[0-9]{4}-[0-9]{2}(,[0-9]{4}-[0-9]{2})*$ ]] || { echo "Meses inválidos: $MESES"; exit 1; }
            python3 scripts/beneficios_para_json.py --buscar --minutos 300 --meses "$MESES"
          else
            python3 scripts/beneficios_para_json.py --buscar --minutos 300
          fi

      # Roda mesmo se a busca falhar no meio: os meses já completos ficam.
      - name: Montar os arquivos do site
        if: ${{ !cancelled() }}
        run: python3 scripts/beneficios_para_json.py --montar

      - name: Gravar se mudou
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if git diff --quiet -- dados-fonte/beneficios site/dados/beneficios \
             && [ -z "$(git ls-files --others --exclude-standard dados-fonte/beneficios site/dados/beneficios)" ]; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados-fonte/beneficios site/dados/beneficios
          git commit -q -m "Atualiza Bolsa Família e BPC por cidade"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep $((i * 5))
          done
          exit 1

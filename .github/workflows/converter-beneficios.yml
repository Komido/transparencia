name: Resumir Bolsa Família e BPC por cidade (Portal da Transparência)

# Busca na API do Portal da Transparência quanto foi pago de Novo Bolsa
# Família e de BPC em cada uma das 5.570 cidades, mês a mês
# (scripts/beneficios_para_json.py), e monta os arquivos que o site lê em
# site/dados/beneficios/. Nada passa pelo banco.
#
# A API exige chave gratuita, guardada no secret PORTAL_TRANSPARENCIA_CHAVE.
# O script faz no máximo cerca de 200 pedidos por minuto, metade do limite do
# Portal, e para depois de 5 horas; o que faltar fica para a próxima execução.
# Cada mês leva cerca de 1 hora e é gravado no repositório assim que termina.
#
# Quem dispara é o agendador do banco (pg_cron, etl.disparar_github), de
# madrugada; ver supabase/migrations/20261117010000_disparo_beneficios.sql.

on:
  workflow_dispatch:
    inputs:
      meses:
        description: "Meses AAAA-MM separados por vírgula (vazio: automático)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: beneficios
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      # Um mês por vez: busca, monta o site e grava no repositório, para que
      # cada mês completo fique salvo mesmo se a execução parar depois.
      - name: Buscar e gravar mês a mês
        env:
          PORTAL_TRANSPARENCIA_CHAVE: ${{ secrets.PORTAL_TRANSPARENCIA_CHAVE }}
          MESES: ${{ github.event.inputs.meses }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          if [ -n "${MESES:-}" ]; then
            [[ "$MESES" =~ ^[0-9]{4}-[0-9]{2}(,[0-9]{4}-[0-9]{2})*$ ]] || { echo "Meses inválidos: $MESES"; exit 1; }
            extra=(--meses "$MESES")
          else
            extra=()
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Uma execução que esperou na fila começa da versão do momento em que
          # foi pedida; pega o que a anterior gravou, para não buscar de novo
          # o mesmo mês e colidir na hora de gravar.
          git pull --rebase --quiet
          fim=$((SECONDS + 300 * 60))
          while :; do
            restam=$(( (fim - SECONDS) / 60 ))
            # O GitHub roda o passo com "bash -e": o código 3 (nada a fazer)
            # precisa ser capturado aqui, senão encerra o passo como erro.
            situacao=0
            python3 scripts/beneficios_para_json.py --buscar --montar --max-meses 1 --minutos "$restam" "${extra[@]}" || situacao=$?
            if [ "$situacao" -eq 3 ]; then echo "Nada mais a buscar nesta execução."; break; fi
            if [ "$situacao" -ne 0 ]; then exit "$situacao"; fi
            git add dados-fonte/beneficios site/dados/beneficios
            if git diff --cached --quiet; then echo "Nada mudou."; break; fi
            git commit -q -m "Atualiza Bolsa Família e BPC por cidade"
            enviado=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --quiet && git push --quiet; then enviado=1; break; fi
              sleep $((i * 5))
            done
            [ "$enviado" -eq 1 ] || exit 1
          done

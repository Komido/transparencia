name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python3 -m pip install --quiet openpyxl==3.1.5

      # Emendas parlamentares: o arquivo único do Portal (sem chave), colunas e
      # como vem o lugar do gasto.
      - name: Portal da Transparência, arquivo de emendas
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/em && cd /tmp/em
          curl -sSL --max-time 600 -A "ArrecadometroBrasil/1.0 (dados publicos)" -o em.zip -w "HTTP %{http_code} %{size_download} bytes\n" \
            "https://dadosabertos-download.cgu.gov.br/PortalDaTransparencia/saida/emendas-parlamentares/EmendasParlamentares.zip" || exit 0
          unzip -l em.zip
          python3 - em.zip <<'PY'
          import collections, csv, io, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          for nome in z.namelist():
              if not nome.lower().endswith(".csv"):
                  continue
              bruto = z.read(nome)
              for cod in ("utf-8-sig", "latin-1"):
                  try:
                      texto = bruto.decode(cod); break
                  except UnicodeDecodeError:
                      continue
              linhas = list(csv.DictReader(io.StringIO(texto), delimiter=";"))
              print("===", nome, "codificação", cod, "linhas", len(linhas))
              print("colunas:", list(linhas[0].keys()))
              for l in linhas[:3]:
                  print({k: v for k, v in l.items() if v})
              for col in linhas[0].keys():
                  c = collections.Counter(l[col] for l in linhas)
                  if len(c) < 60:
                      print(f"  {col}: {c.most_common(12)}")
              ano = next((k for k in linhas[0] if "Ano" in k), None)
              if ano:
                  print("  por ano:", sorted(collections.Counter(l[ano] for l in linhas).items()))
          PY

      - name: Lei 9.250/1995 (isenção do IR de 1996 a 2000)
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/lei && cd /tmp/lei
          for url in \
            "https://www.planalto.gov.br/ccivil_03/leis/L9250.htm" \
            "https://www.planalto.gov.br/ccivil_03/LEIS/L9250.htm" \
            "http://www.planalto.gov.br/ccivil_03/leis/l9250.htm" \
            "https://www.lexml.gov.br/urn/urn:lex:br:federal:lei:1995-12-26;9250" \
            "https://normas.leg.br/api/normas?urn=urn:lex:br:federal:lei:1995-12-26;9250&tipo_documento=maior-detalhe"; do
            echo "=== $url"
            curl -sSL --max-time 90 -A "Mozilla/5.0 (X11; Linux x86_64)" -o lei.html -w "%{http_code} %{size_download} bytes %{url_effective}\n" "$url" || continue
            python3 - lei.html <<'PY2'
          import html, re, sys
          bruto = open(sys.argv[1], "rb").read()
          for cod in ("utf-8", "cp1252", "latin-1"):
              try:
                  texto = bruto.decode(cod); print("codificação:", cod); break
              except UnicodeDecodeError:
                  continue
          titulo = re.search(r"(?is)<title>(.*?)</title>", texto)
          print("título:", titulo.group(1).strip() if titulo else "-")
          texto = re.sub(r"(?is)<(script|style).*?</\1>", " ", texto)
          texto = html.unescape(re.sub(r"<[^>]+>", " ", texto)).replace("\xa0", " ")
          texto = re.sub(r"\s+", " ", texto)
          print("tamanho do texto:", len(texto))
          for padrao in (r"Art\. 3", r"10\.800", r"900,00", r"isen"):
              achados = [m.start() for m in re.finditer(padrao, texto)][:4]
              print(f"== {padrao}: {len(achados)} ocorrências")
              for k in achados:
                  print("  ...", texto[max(0, k - 200):k + 400], "...")
          PY2
          done


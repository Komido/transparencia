name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      # Salário dos vereadores nas câmaras paulistas: em que elementos de
      # despesa do grupo "pessoal" ele aparece em 2024 e em 2025? Conta valores
      # por elemento e os lançamentos cujo histórico fala em subsídio ou
      # vereador. Sem nomes no registro.
      - name: TCE-SP, elementos de pessoal nas câmaras, 2024 e 2025
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import collections, csv, io, os, sys, zipfile
          sys.path.insert(0, "scripts")
          import camaras_sp_para_json as m
          for ano in (2024, 2025):
              url = m.ARQUIVO.format(ano=ano)
              tam, mod, _ = m.cabecalho(url)
              cam = f"/tmp/d{ano}.zip"
              m.baixar_em_partes(url, cam, tam)
              z = zipfile.ZipFile(cam)
              nome = [x for x in z.infolist() if x.filename.lower().endswith(".csv")][0]
              soma = collections.Counter(); pf = collections.Counter(); hist = collections.Counter()
              camaras = collections.defaultdict(set); campinas = collections.Counter()
              with z.open(nome) as b:
                  r = csv.reader(io.TextIOWrapper(b, encoding="latin-1", newline=""), delimiter=";")
                  cab = next(r); I = {c: cab.index(c) for c in cab}
                  for l in r:
                      if l[I["tp_despesa"]] != "Valor Pago": continue
                      o = m.sem_acento(l[I["ds_orgao"]])
                      if not ("CAMARA" in o or "LEGISLATIV" in o or "VEREADOR" in o) or "PREFEITURA" in o: continue
                      e = l[I["ds_elemento"]].strip()
                      if not e.startswith("319"): continue
                      v = m.numero(l[I["vl_despesa"]])
                      soma[e] += v; camaras[e].add(l[I["codigo_municipio_ibge"]])
                      if "FISICA" in m.sem_acento(l[I["tp_identificador_despesa"]]): pf[e] += v
                      h = m.sem_acento(l[I["historico_despesa"]])
                      if "SUBSIDIO" in h or "VEREADOR" in h or "EDIS" in h: hist[e] += v
                      if l[I["codigo_municipio_ibge"]].strip() == "3509502": campinas[e] += v
              print(f"\n{ano}: grupo pessoal nas câmaras, por elemento (R$ mi pago | a pessoa física | histórico fala em subsídio/vereador | câmaras)")
              for e, v in soma.most_common(30):
                  print(f"  {v / 1e6:9.1f} | {pf[e] / 1e6:8.1f} | {hist[e] / 1e6:8.1f} | {len(camaras[e]):4d} | {e}")
              print(f"  Campinas {ano}: " + "; ".join(f"{e[:8]} {v / 1e6:.2f}" for e, v in campinas.most_common(10)))
              os.remove(cam)
          PY


name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # STF: composição e quem indicou cada ministro (site do STF), placar de
      # cada aprovação no Senado (dados abertos do Senado) e onde estão os
      # gastos do STF (portal de transparência do STF e o arquivo anual
      # "Orçamento da despesa" do Portal da Transparência, que cobre o
      # orçamento federal inteiro). Só leitura, respeitando o robots.txt.
      - name: Gastos do STF, planilha da LC 200 e RGF do STF
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import collections, csv, html.parser, io, json, re, time, urllib.error, urllib.parse, urllib.request, urllib.robotparser

          AGENTE = "ArrecadometroBrasil/1.0 (dados publicos)"
          PALAVRAS = re.compile(r"dado|abert|conjunto|despes|empenh|pagament|folha|pessoal|remunera|c[aâ]mara|legislat|vereador|api|csv|zip|json|xls|download|sicom|capmg|fiscaliz|dicion|layout|leiaute", re.I)
          vistos = set()
          robots = {}

          class Pagina(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links, self.scripts, self.titulo, self.texto = [], [], "", []
                  self._a = None; self._t = []; self._titulo = False
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "a" and a.get("href"): self._a = a["href"]; self._t = []
                  if tag == "script" and a.get("src"): self.scripts.append(a["src"])
                  if tag == "title": self._titulo = True
              def handle_endtag(self, tag):
                  if tag == "a" and self._a is not None:
                      self.links.append((self._a, " ".join("".join(self._t).split())[:90])); self._a = None
                  if tag == "title": self._titulo = False
              def handle_data(self, d):
                  if self._a is not None: self._t.append(d)
                  if self._titulo: self.titulo += d
                  if d.strip(): self.texto.append(d.strip())

          atraso = {}
          def baixar(url, limite=5_000_000):
              time.sleep(atraso.get(urllib.parse.urlsplit(url).netloc, 2))
              pedido = urllib.request.Request(url, headers={"User-Agent": AGENTE, "Accept": "*/*"})
              try:
                  with urllib.request.urlopen(pedido, timeout=90) as r:
                      return r.status, r.headers.get("Content-Type", ""), r.geturl(), r.read(limite)
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get("Content-Type", ""), url, e.read(20000)

          def permitido(url):
              p = urllib.parse.urlsplit(url); base = f"{p.scheme}://{p.netloc}"
              if base not in robots:
                  rp = urllib.robotparser.RobotFileParser()
                  try:
                      st, _, _, corpo = baixar(base + "/robots.txt", 200_000)
                      linhas = corpo.decode("utf-8", "replace").splitlines() if st == 200 else []
                      print(f"\nrobots.txt de {p.netloc}: HTTP {st}" + ("".join("\n    " + l for l in linhas[:30]) if linhas else ""))
                      rp.parse(linhas)
                      # Respeita o Crawl-Delay e trata qualquer bloco "User-agent: *"
                      # com "Disallow: /" como proibição total (o leitor do Python
                      # só olha o primeiro bloco).
                      atraso[p.netloc] = max(2, float(rp.crawl_delay(AGENTE) or 0))
                      grupo, proibe = None, False
                      for l in linhas:
                          k, _, v = l.split("#")[0].partition(":")
                          k, v = k.strip().lower(), v.strip()
                          if k == "user-agent": grupo = v
                          elif k == "disallow" and grupo == "*" and v == "/": proibe = True
                      if proibe:
                          print("    (um bloco para todos os robôs proíbe o site inteiro: nada será lido)")
                          robots[base] = "proibido"
                          return False
                  except Exception as e:
                      print(f"\nrobots.txt de {p.netloc}: erro {e!r}"); rp = None
                  robots[base] = rp
              rp = robots[base]
              if rp == "proibido": return False
              return rp is None or rp.can_fetch(AGENTE, url)

          def ver(url, seguir=False, limite=5_000_000, maximo_links=70):
              if url in vistos: return None
              vistos.add(url)
              if not permitido(url):
                  print(f"\n### {url}\n  robots.txt não permite; pulado"); return None
              try:
                  st, tipo, final, corpo = baixar(url, limite)
              except Exception as e:
                  print(f"\n### {url}\n  erro: {e!r}"); return None
              print(f"\n### {url}\n  HTTP {st} | {tipo} | {len(corpo)} bytes" + (f" | foi para {final}" if final != url else ""))
              if "json" in tipo or corpo[:1] in (b"[", b"{"):
                  try:
                      d = json.loads(corpo.decode("utf-8-sig", "replace"))
                      if isinstance(d, list):
                          print(f"  lista com {len(d)} itens; primeiros: {json.dumps(d[:3], ensure_ascii=False)[:1200]}")
                      else:
                          print(f"  objeto: {json.dumps(d, ensure_ascii=False)[:1500]}")
                      return d
                  except Exception as e:
                      print(f"  não é JSON válido ({e}); início: {corpo[:300]!r}"); return None
              if "html" not in tipo:
                  print(f"  início: {corpo[:400]!r}"); return None
              p = Pagina(); p.feed(corpo.decode("utf-8", "replace"))
              print(f"  título: {' '.join(p.titulo.split())[:120]}")
              links = []
              for href, texto in p.links:
                  absoluto = urllib.parse.urljoin(final, href.strip())
                  if absoluto.startswith("http") and (PALAVRAS.search(absoluto) or PALAVRAS.search(texto)) and absoluto not in [l for l, _ in links]:
                      links.append((absoluto, texto))
              print(f"  links no total: {len(p.links)}; ligados ao assunto: {len(links)}")
              for l, t in links[:maximo_links]: print(f"    {t[:60]!r} -> {l}")
              if len(p.links) < 8:
                  print(f"  poucos links (página montada por script?). scripts: {p.scripts[:12]}")
                  print(f"  texto: {' | '.join(p.texto)[:800]}")
              if seguir:
                  host = urllib.parse.urlsplit(final).netloc
                  proximos = [l for l, _ in links if urllib.parse.urlsplit(l).netloc == host and not re.search(r"\.(zip|csv|xlsx?|pdf)(\?|$)", l, re.I)]
                  for l in proximos[:12]: ver(l)
              return None

          def ckan(base, termos):
              for t in termos:
                  d = ver(f"{base}/api/3/action/package_search?q={urllib.parse.quote(t)}&rows=15", limite=8_000_000)
                  if not isinstance(d, dict) or not d.get("success"): continue
                  print(f"  CKAN {base}, busca {t!r}: {d['result'].get('count')} conjuntos")
                  for p in d["result"].get("results", []):
                      print(f"    conjunto {p.get('name')!r}: {p.get('title')!r}")
                      for r in p.get("resources", [])[:8]:
                          print(f"      {r.get('format')!s:6} {r.get('size')!s:>12}  {r.get('name')!r}  {r.get('url')}")

          def estado(titulo, raizes, base_ckan=None, termos=("despesa", "empenho", "pagamento")):
              print("\n" + "=" * 70 + f"\n{titulo}\n" + "=" * 70)
              for u in raizes: ver(u, seguir=True, maximo_links=50)
              if base_ckan: ckan(base_ckan, termos)

          def texto(url, n=3000, maximo_links=40):
              if url in vistos or not permitido(url): return
              vistos.add(url)
              try:
                  st, tipo, final, corpo = baixar(url)
              except Exception as e:
                  print(f"\n### {url}\n  erro: {e!r}"); return
              print(f"\n### {url}\n  HTTP {st} | {tipo} | {len(corpo)} bytes" + (f" | foi para {final}" if final != url else ""))
              if "html" in tipo:
                  pg = Pagina(); pg.feed(corpo.decode("utf-8", "replace"))
                  print("  " + " | ".join(pg.texto)[:n])
                  ligados = [(urllib.parse.urljoin(final, h), t) for h, t in pg.links if PALAVRAS.search(h + " " + t)]
                  for l, t in ligados[:maximo_links]: print(f"    {t[:60]!r} -> {l}")
              else:
                  print(f"  início: {corpo[:n]!r}")

          PALAVRAS = re.compile(r"ministr|composi|biografi|curr[ií]cul|transpar|or[cç]ament|despes|execu|remunera|di[aá]ria|passage|csv|xls|dados|abert|download", re.I)

          import subprocess
          subprocess.run(["python3", "-m", "pip", "install", "--quiet", "openpyxl==3.1.5"], capture_output=True)
          import openpyxl
          print("=" * 70 + "\nTesouro: Despesas e Transferências Totais da União (valor pago), 2025\n" + "=" * 70)
          url = "https://www.tesourotransparente.gov.br/ckan/dataset/8675a0a4-31c5-4593-a24d-fb8e17376eca/resource/f40d5431-058d-48b8-9ab6-065fb0fce5b3/download/limite-gastos-lc200dez25.xlsx"
          try:
              st, tipo, final, corpo = baixar(url, 60_000_000)
              open("/tmp/lc200.xlsx", "wb").write(corpo)
              wb = openpyxl.load_workbook("/tmp/lc200.xlsx", read_only=True, data_only=True)
              for ws in wb.worksheets:
                  linhas = list(ws.iter_rows(values_only=True))
                  print(f"\n  aba {ws.title!r}: {len(linhas)} linhas")
                  for l in linhas[:8]: print("    ", [c for c in l if c is not None][:14])
                  for n, l in enumerate(linhas):
                      t = " ".join(str(c) for c in l if c is not None)
                      if re.search(r"Supremo|Judici", t, re.I): print(f"    linha {n}: {[c for c in l if c is not None][:16]}")
          except Exception as e:
              print(f"  erro: {e!r}")

          print("\n" + "=" * 70 + "\nSICONFI: RGF da União, Judiciário, só o STF (paginando)\n" + "=" * 70)
          API = "https://apidatalake.tesouro.gov.br/ords/siconfi/tt"
          base = "rgf?an_exercicio=2025&in_periodicidade=Q&nr_periodo=3&co_tipo_demonstrativo=RGF&no_anexo=RGF-Anexo%2001&co_esfera=U&co_poder=J&id_ente=1"
          todas, offset = [], 0
          while True:
              time.sleep(2)
              pedido = urllib.request.Request(f"{API}/{base}&offset={offset}", headers={"User-Agent": AGENTE, "Accept": "application/json"})
              with urllib.request.urlopen(pedido, timeout=120) as r:
                  d = json.loads(r.read().decode("utf-8"))
              itens = d.get("items") or []
              todas += itens
              if not d.get("hasMore") or not itens or offset > 60000: break
              offset += len(itens)
          inst = collections.Counter(x.get("instituicao") for x in todas)
          print(f"  {len(todas)} linhas; {len(inst)} instituições: {sorted(inst)}")
          stf = [x for x in todas if "Supremo" in str(x.get("instituicao"))]
          print(f"  linhas do STF: {len(stf)}")
          for x in stf:
              if re.search(r"TOTAL|DESPESA L|RECEITA CORRENTE|LIMITE|%", str(x.get("conta")), re.I) and x.get("coluna") in ("TOTAL (ÚLTIMOS 12 MESES) (a)", "VALOR", "% SOBRE A RCL AJUSTADA", "%", None) or "TOTAL" in str(x.get("coluna")).upper():
                  print(f"    {x.get('conta')} | {x.get('coluna')} | {x.get('valor')}")
          PY

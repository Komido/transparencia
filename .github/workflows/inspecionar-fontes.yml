name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF e Excel) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python3 -m pip install --quiet openpyxl==3.1.5

      - name: Lei 9.250/1995 (isenção do IR de 1996 a 2000)
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/lei && cd /tmp/lei
          curl -sSL --max-time 90 -A "Mozilla/5.0 (X11; Linux x86_64)" -o lei.html -w "%{http_code} %{size_download} bytes %{url_effective}\n" \
            "https://www.planalto.gov.br/ccivil_03/leis/l9250.htm"
          file lei.html
          python3 - lei.html <<'PY2'
          import html, re, sys
          bruto = open(sys.argv[1], "rb").read()
          for cod in ("utf-8", "cp1252", "latin-1"):
              try:
                  texto = bruto.decode(cod); print("codificação:", cod); break
              except UnicodeDecodeError:
                  continue
          titulo = re.search(r"(?is)<title>(.*?)</title>", texto)
          print("título:", titulo.group(1).strip() if titulo else "-")
          texto = re.sub(r"(?is)<(script|style).*?</\1>", " ", texto)
          texto = html.unescape(re.sub(r"<[^>]+>", " ", texto)).replace("\xa0", " ")
          texto = re.sub(r"\s+", " ", texto)
          print("tamanho do texto:", len(texto))
          for padrao in (r"Art\. 3", r"10\.800", r"900,00", r"isen"):
              achados = [m.start() for m in re.finditer(padrao, texto)][:4]
              print(f"== {padrao}: {len(achados)} ocorrências")
              for k in achados:
                  print("  ...", texto[max(0, k - 200):k + 400], "...")
          PY2


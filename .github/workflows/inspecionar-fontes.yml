name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF e Excel) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python3 -m pip install --quiet openpyxl==3.1.5

      - name: Contas anuais das prefeituras em lote (FINBRA/DCA, Tesouro)
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/finbra && cd /tmp/finbra
          baixar() { curl -sSL --max-time 120 -A "Mozilla/5.0 (X11; Linux x86_64)" -o "$2" -w "%{http_code} %{size_download} bytes %{time_total}s\n" "$1"; }
          for q in finbra "financas do brasil" "contas anuais" dca; do
            echo "=== CKAN do Tesouro Transparente: busca '$q'"
            url="https://www.tesourotransparente.gov.br/ckan/api/3/action/package_search?rows=10&q=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$q")"
            baixar "$url" busca.json || continue
            python3 - busca.json <<'PY2'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception as e:
              print("resposta não é JSON:", e); raise SystemExit
          for p in d.get("result", {}).get("results", []):
              print("*", p.get("name"), "|", p.get("title"))
              for r in p.get("resources", [])[:15]:
                  print("   -", r.get("format"), "|", r.get("name"), "|", r.get("url"), "|", r.get("size"))
          PY2
          done
          echo "=== Página do FINBRA no SICONFI"
          baixar "https://siconfi.tesouro.gov.br/siconfi/pages/public/consulta_finbra/finbra_list.jsf" finbra.html
          grep -oiE 'href="[^"]+"' finbra.html | grep -iE 'zip|csv|finbra|download' | sort -u | head -40
          grep -oiE '[^<>]{0,60}(exerc[ií]cio|ano)[^<>]{0,60}' finbra.html | sort -u | head -20
          echo "=== Uma chamada da API /dca (São Paulo, 2024, Anexo I-C), para medir tempo e tamanho"
          baixar "https://apidatalake.tesouro.gov.br/ords/siconfi/tt/dca?an_exercicio=2024&no_anexo=DCA-Anexo%20I-C&id_ente=3550308" dca.json
          python3 -c "import json;d=json.load(open('dca.json'));print('itens:',len(d['items']));print('colunas:',list(d['items'][0].keys()) if d['items'] else '-')"


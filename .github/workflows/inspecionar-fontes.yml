name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python3 -m pip install --quiet openpyxl==3.1.5

      # Benefícios por município na API do Portal da Transparência. A chave
      # (secret PORTAL_TRANSPARENCIA_CHAVE) vai só no cabeçalho e o GitHub a
      # esconde no registro. Dados agregados por cidade, sem pessoas.
      - name: Portal da Transparência, benefícios por município
        continue-on-error: true
        env:
          CHAVE: ${{ secrets.PORTAL_TRANSPARENCIA_CHAVE }}
        run: |
          set -u
          if [ -z "${CHAVE}" ]; then echo "secret PORTAL_TRANSPARENCIA_CHAVE vazio ou ausente"; exit 1; fi
          echo "chave presente (${#CHAVE} caracteres)"
          api=https://api.portaldatransparencia.gov.br/api-de-dados
          pedir() {
            echo "=== $1"
            curl -sS --max-time 60 -D cab.txt -o resp.json -w "HTTP %{http_code} %{size_download} bytes %{time_total}s\n" \
              -H "accept: application/json" -H "chave-api-dados: ${CHAVE}" "$api/$1" || return 0
            grep -i "^x-rate\|^retry-after\|^content-type" cab.txt || true
            head -c 1500 resp.json; echo
            sleep 2
          }
          echo "--- sem chave (deve recusar)"
          curl -sS --max-time 60 -o /dev/null -w "HTTP %{http_code}\n" "$api/bpc-por-municipio?mesAno=202609&codigoIbge=3550308&pagina=1" || true
          for cod in 3550308 3143104 1200401; do
            for mes in 202609 202610 202611; do
              pedir "novo-bolsa-familia-por-municipio?mesAno=${mes}&codigoIbge=${cod}&pagina=1"
              pedir "bpc-por-municipio?mesAno=${mes}&codigoIbge=${cod}&pagina=1"
            done
          done
          echo "--- página 2 (deve vir vazia)"
          pedir "bpc-por-municipio?mesAno=202609&codigoIbge=3550308&pagina=2"
          echo "--- programas anteriores ao Novo Bolsa Família"
          pedir "novo-bolsa-familia-por-municipio?mesAno=202303&codigoIbge=3550308&pagina=1"
          pedir "novo-bolsa-familia-por-municipio?mesAno=202302&codigoIbge=3550308&pagina=1"
          pedir "auxilio-brasil-por-municipio?mesAno=202206&codigoIbge=3550308&pagina=1"
          pedir "bolsa-familia-por-municipio?mesAno=202001&codigoIbge=3550308&pagina=1"
          pedir "bpc-por-municipio?mesAno=201501&codigoIbge=3550308&pagina=1"

      # Os mesmos benefícios em arquivo mensal com todas as cidades (sem chave).
      # Só cabeçalhos: nome do arquivo para onde o Portal redireciona e tamanho.
      - name: Portal da Transparência, arquivos mensais de benefícios (cabeçalhos)
        continue-on-error: true
        run: |
          set -u
          for base in novo-bolsa-familia bpc auxilio-brasil bolsa-familia-pagamentos; do
            for mes in 202609 202610; do
              url="https://portaldatransparencia.gov.br/download-de-dados/${base}/${mes}"
              echo "=== ${url}"
              curl -sS -I -L --max-time 60 -A "Mozilla/5.0 (X11; Linux x86_64)" "$url" \
                | grep -i "^HTTP\|^location\|^content-length\|^content-type\|^last-modified" || true
              sleep 3
            done
          done

      - name: Lei 9.250/1995 (isenção do IR de 1996 a 2000)
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/lei && cd /tmp/lei
          for url in \
            "https://www.planalto.gov.br/ccivil_03/leis/L9250.htm" \
            "https://www.planalto.gov.br/ccivil_03/LEIS/L9250.htm" \
            "http://www.planalto.gov.br/ccivil_03/leis/l9250.htm" \
            "https://www.lexml.gov.br/urn/urn:lex:br:federal:lei:1995-12-26;9250" \
            "https://normas.leg.br/api/normas?urn=urn:lex:br:federal:lei:1995-12-26;9250&tipo_documento=maior-detalhe"; do
            echo "=== $url"
            curl -sSL --max-time 90 -A "Mozilla/5.0 (X11; Linux x86_64)" -o lei.html -w "%{http_code} %{size_download} bytes %{url_effective}\n" "$url" || continue
            python3 - lei.html <<'PY2'
          import html, re, sys
          bruto = open(sys.argv[1], "rb").read()
          for cod in ("utf-8", "cp1252", "latin-1"):
              try:
                  texto = bruto.decode(cod); print("codificação:", cod); break
              except UnicodeDecodeError:
                  continue
          titulo = re.search(r"(?is)<title>(.*?)</title>", texto)
          print("título:", titulo.group(1).strip() if titulo else "-")
          texto = re.sub(r"(?is)<(script|style).*?</\1>", " ", texto)
          texto = html.unescape(re.sub(r"<[^>]+>", " ", texto)).replace("\xa0", " ")
          texto = re.sub(r"\s+", " ", texto)
          print("tamanho do texto:", len(texto))
          for padrao in (r"Art\. 3", r"10\.800", r"900,00", r"isen"):
              achados = [m.start() for m in re.finditer(padrao, texto)][:4]
              print(f"== {padrao}: {len(achados)} ocorrências")
              for k in achados:
                  print("  ...", texto[max(0, k - 200):k + 400], "...")
          PY2
          done


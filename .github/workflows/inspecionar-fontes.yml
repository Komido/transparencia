name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # TCE-RS: o arquivo anual "Despesa orçamentária por empenhos" (todos os
      # municípios) tem valor pago, código da cidade e um jeito seguro de achar
      # a Câmara? Só leitura. O robots.txt do portal proíbe /api/ e pede 10
      # segundos entre pedidos: são poucos pedidos, todos fora de /api/, com
      # 10 segundos de intervalo. Nomes de pessoas não vão para o registro.
      - name: TCE-RS, colunas do arquivo de empenhos de 2025 e tabelas de apoio
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import collections, csv, html.parser, io, os, re, time, urllib.parse, urllib.request, urllib.robotparser, zipfile
          AGENTE = "ArrecadometroBrasil/1.0 (dados publicos)"
          BASE = "https://dados.tce.rs.gov.br"
          rp = urllib.robotparser.RobotFileParser()
          ultimo = [0.0]
          def pedir(url, cab=None, tempo=300):
              espera = 10 - (time.time() - ultimo[0])
              if espera > 0: time.sleep(espera)
              ultimo[0] = time.time()
              if url.startswith(BASE) and not rp.can_fetch(AGENTE, url):
                  raise SystemExit(f"robots.txt não permite {url}")
              return urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": AGENTE, **(cab or {})}), timeout=tempo)
          with pedir(BASE + "/robots.txt") as r:
              linhas = r.read().decode("utf-8", "replace").splitlines()
          rp.parse(linhas)
          print("robots.txt:", [l for l in linhas if l.strip() and not l.startswith("#")][:12], "| crawl-delay:", rp.crawl_delay(AGENTE))

          class Links(html.parser.HTMLParser):
              def __init__(self): super().__init__(); self.links = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "a" and a.get("href"): self.links.append(a["href"])
          def recursos(conjunto):
              with pedir(f"{BASE}/dataset/{conjunto}") as r:
                  p = Links(); p.feed(r.read().decode("utf-8", "replace"))
              return sorted({urllib.parse.urljoin(BASE, h) for h in p.links if re.search(r"/dados/.+\.(csv|zip|7z|json|xml)", h)})

          # Tabelas de apoio: tipos de unidade orçamentária e elementos de despesa.
          for conjunto in ("tipos-de-unidade-orcamentaria", "elemento-de-despesa"):
              urls = recursos(conjunto)
              print(f"\n{conjunto}: {urls}")
              csvs = [u for u in urls if u.endswith(".csv")]
              if csvs:
                  with pedir(csvs[0]) as r:
                      t = r.read(400_000)
                  try: texto = t.decode("utf-8-sig")
                  except UnicodeDecodeError: texto = t.decode("latin-1")
                  ls = texto.splitlines()
                  print(f"  {len(ls)} linhas lidas; primeiras:")
                  for l in ls[:40 if conjunto.startswith("tipos") else 8]: print("   ", l[:200])

          # Arquivo anual de 2025.
          urls = recursos("despesa-orcamentaria-por-empenhos-2025")
          print(f"\nempenhos 2025: {urls}")
          url = next(u for u in urls if u.endswith(".csv.zip"))
          with pedir(url, tempo=60) as r:
              tamanho = int(r.headers.get("Content-Length") or 0)
              print(f"  {url}: {tamanho / 1e6:.0f} MB, Last-Modified {r.headers.get('Last-Modified')}, Accept-Ranges {r.headers.get('Accept-Ranges')}")
              destino = "/tmp/rs.zip"
              inicio = time.time()
              with open(destino, "wb") as fh:
                  while True:
                      b = r.read(1 << 20)
                      if not b: break
                      fh.write(b)
          print(f"  baixado em {(time.time() - inicio) / 60:.1f} min: {os.path.getsize(destino) / 1e6:.0f} MB")
          z = zipfile.ZipFile(destino)
          for i in z.infolist(): print(f"  dentro do zip: {i.filename}, {i.file_size / 1e6:.0f} MB")
          nome = max(z.infolist(), key=lambda i: i.file_size).filename
          bruto = z.open(nome).read(200_000)
          try: bruto.decode("utf-8-sig"); cod = "utf-8-sig"
          except UnicodeDecodeError: cod = "latin-1"
          primeira = bruto.decode(cod, "replace").splitlines()[0]
          sep = max(";,\t|", key=primeira.count)
          leitor = csv.DictReader(io.TextIOWrapper(z.open(nome), encoding=cod, newline="", errors="replace"), delimiter=sep)
          cols = leitor.fieldnames
          print(f"  codificação {cod}, separador {sep!r}, {len(cols)} colunas: {cols}")
          pessoal = [c for c in cols if re.search(r"nome|credor|cpf|cnpj|favorecido|historico|hist", c, re.I)]
          print(f"  colunas que podem ter dados de pessoas (não impressas nos exemplos): {pessoal}")
          poucos = collections.defaultdict(collections.Counter)
          linhas = 0
          camaras = collections.Counter()
          for l in leitor:
              linhas += 1
              if linhas <= 3: print("  exemplo:", {k: v for k, v in l.items() if k not in pessoal})
              for c in cols:
                  if c in pessoal: continue
                  if len(poucos[c]) < 400 or l[c] in poucos[c]: poucos[c][l[c]] += 1
              for c in cols:
                  if c not in pessoal and re.search(r"C[AÂ]MARA|LEGISLATIV", l[c] or "", re.I): camaras[c] += 1
          print(f"\n  linhas: {linhas}")
          for c in cols:
              if c in pessoal: continue
              n = len(poucos[c])
              print(f"  {c}: {n}{'+' if n >= 400 else ''} valores; mais comuns: {poucos[c].most_common(12)}")
          print(f"  colunas onde aparece 'câmara' ou 'legislativo': {camaras.most_common()}")
          PY

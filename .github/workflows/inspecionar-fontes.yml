name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF e Excel) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python3 -m pip install --quiet openpyxl==3.1.5

      - name: Cota parlamentar, Câmara e Senado (formato dos arquivos)
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/cota && cd /tmp/cota
          cat > resumo.py <<'PY'
          import csv, sys, collections
          caminho, separador = sys.argv[1], sys.argv[2]
          bruto = open(caminho, 'rb').read()
          print('bytes', len(bruto), 'começo', bruto[:4])
          for codificacao in ('utf-8-sig', 'cp1252', 'latin-1'):
              try:
                  texto = bruto.decode(codificacao)
                  print('codificação que funciona:', codificacao)
                  break
              except UnicodeDecodeError:
                  continue
          linhas = texto.splitlines()
          print('primeiras linhas:')
          for l in linhas[:3]:
              print('  ', l[:400])
          inicio = 0
          while inicio < len(linhas) and separador not in linhas[inicio]:
              inicio += 1
          if linhas and linhas[0].count(separador) <= 1 and len(linhas) > 1:
              inicio = 1
          leitor = csv.DictReader(linhas[inicio:], delimiter=separador)
          print('colunas:', leitor.fieldnames)
          contagens = collections.defaultdict(collections.Counter)
          n = 0
          exemplos = []
          for linha in leitor:
              n += 1
              for coluna in leitor.fieldnames:
                  if any(p in coluna.lower() for p in ('descri', 'tipo', 'uf', 'partido', 'mes', 'ano', 'senador', 'nucarteira', 'idecadastro', 'txnomeparlamentar', 'numano', 'nummes', 'codlegislatura')):
                      contagens[coluna][linha.get(coluna)] += 1
              if n <= 2:
                  exemplos.append(linha)
          print('linhas de dados', n)
          for coluna, cont in contagens.items():
              print(f'{coluna}: {len(cont)} valores distintos; mais comuns {cont.most_common(12)}')
          for e in exemplos:
              print('exemplo', e)
          PY
          echo "=== Câmara, arquivo anual"
          for ano in 2025 2016; do
            url="https://www.camara.leg.br/cotas/Ano-${ano}.csv.zip"
            echo "--- $url"
            curl -sSL --max-time 300 -A "ArrecadometroBrasil/1.0" -o "camara-${ano}.zip" -w "%{http_code} %{size_download} bytes %{content_type}\n" "$url" || { echo "falhou"; continue; }
            unzip -o -q "camara-${ano}.zip" -d "camara-${ano}" || { echo "não é zip"; head -c 500 "camara-${ano}.zip"; continue; }
            ls -la "camara-${ano}"
            arquivo=$(ls camara-${ano}/* | head -1)
            python3 resumo.py "$arquivo" ";"
          done
          echo "=== Senado"
          for url in \
            "https://www.senado.leg.br/transparencia/LAI/verba/despesa_ceaps_2025.csv" \
            "https://www.senado.leg.br/transparencia/LAI/verba/despesa_ceaps_2016.csv"; do
            echo "--- $url"
            curl -sSL --max-time 180 -A "ArrecadometroBrasil/1.0" -o senado.csv -w "%{http_code} %{size_download} bytes %{content_type}\n" "$url" || { echo "falhou"; continue; }
            python3 resumo.py senado.csv ";"
          done
          for url in \
            "https://adm.senado.gov.br/adm-dadosabertos/api/v1/senadores/despesas_ceaps/2025" \
            "https://dadosabertos.camara.leg.br/api/v2/deputados?itens=2" \
            "https://legis.senado.leg.br/dadosabertos/senador/lista/atual.json"; do
            echo "--- $url"
            curl -sSL --max-time 120 -A "ArrecadometroBrasil/1.0" -H "Accept: application/json" -o api.out -w "%{http_code} %{size_download} bytes %{content_type}\n" "$url" || { echo "falhou"; continue; }
            head -c 1500 api.out; echo
          done

      - name: DIEESE, metodologia da cesta e do salário necessário
        continue-on-error: true
        run: |
          set -u
          for url in \
            https://www.dieese.org.br/metodologia/metodologiaCestaBasica2016.pdf \
            https://www.dieese.org.br/metodologia/metodologiaCestaBasica.pdf; do
            echo "=== $url"
            curl -sSfL --max-time 60 -A "ArrecadometroBrasil/1.0" "$url" -o /tmp/doc.pdf || { echo "falhou"; continue; }
            pdftotext -layout /tmp/doc.pdf /tmp/doc.txt
            grep -n -i -E -C 3 "adulto|criança|crianca|unidade.{0,20}consumo|necess[aá]rio|propor[cç][aã]o|35,|famil" /tmp/doc.txt | head -120
          done

      - name: IBGE, POF 2017-2018 (data de referência dos valores)
        continue-on-error: true
        run: |
          set -u
          for url in \
            https://biblioteca.ibge.gov.br/visualizacao/livros/liv101670.pdf; do
            echo "=== $url"
            curl -sSfL --max-time 120 -A "ArrecadometroBrasil/1.0" "$url" -o /tmp/pof.pdf || { echo "falhou"; continue; }
            pdftotext -layout /tmp/pof.pdf /tmp/pof.txt
            head -c 600 /tmp/pof.txt
            echo
            grep -n -i -E -C 2 "pre[cç]os de|deflacion|data de refer|15 de janeiro" /tmp/pof.txt | head -80
          done

      - name: FipeZAP, estrutura da planilha
        continue-on-error: true
        run: |
          set -u
          curl -sSfL --max-time 120 -A "ArrecadometroBrasil/1.0" \
            https://downloads.fipe.org.br/indices/fipezap/fipezap-serieshistoricas.xlsx -o /tmp/fipezap.xlsx
          sha256sum /tmp/fipezap.xlsx
          python3 - <<'PY'
          from openpyxl import load_workbook
          wb = load_workbook("/tmp/fipezap.xlsx", read_only=True, data_only=True)
          print("planilhas:", wb.sheetnames)
          for nome in wb.sheetnames[:3] + [n for n in wb.sheetnames if "BRASIL" in n.upper() or "INDICE" in n.upper()][:2]:
              ws = wb[nome]
              print(f"\n--- {nome} ({ws.max_row} linhas x {ws.max_column} colunas)")
              for i, linha in enumerate(ws.iter_rows(values_only=True)):
                  if i >= 14:
                      break
                  print(i + 1, [c for c in linha[:40]])
              ultimas = list(ws.iter_rows(min_row=max(1, ws.max_row - 2), values_only=True))
              for linha in ultimas:
                  print("fim", [c for c in linha[:40]])
          PY

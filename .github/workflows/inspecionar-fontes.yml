name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Placar da aprovação de Gilmar Mendes pelo Senado (2002), que não veio
      # na busca de votações usada para os outros ministros. Procura a
      # mensagem presidencial (MSF) de 2002 nos dados abertos do Senado, a
      # tramitação dela e as votações do plenário de abril a junho de 2002.
      # Só leitura, respeitando o robots.txt.
      - name: Placar de Gilmar Mendes no Senado (2002)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.error, urllib.parse, urllib.request, urllib.robotparser

          AGENTE = "ArrecadometroBrasil/1.0 (dados publicos)"
          BASE = "https://legis.senado.leg.br"
          API = BASE + "/dadosabertos"

          def baixar(url, aceitar="application/json", limite=20_000_000):
              time.sleep(2)
              pedido = urllib.request.Request(url, headers={"User-Agent": AGENTE, "Accept": aceitar})
              try:
                  with urllib.request.urlopen(pedido, timeout=90) as r:
                      return r.status, r.headers.get("Content-Type", ""), r.read(limite)
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get("Content-Type", ""), e.read(20000)
              except Exception as e:
                  return 0, "", repr(e).encode()

          st, _, corpo = baixar(BASE + "/robots.txt", "text/plain")
          linhas = corpo.decode("utf-8", "replace").splitlines() if st == 200 else []
          print(f"robots.txt: HTTP {st}")
          for l in linhas[:30]: print("   ", l)
          rp = urllib.robotparser.RobotFileParser(); rp.parse(linhas)
          grupo, proibe = None, False
          for l in linhas:
              k, _, v = l.split("#")[0].partition(":")
              k, v = k.strip().lower(), v.strip()
              if k == "user-agent": grupo = v
              elif k == "disallow" and grupo == "*" and v == "/": proibe = True
          if proibe: raise SystemExit("robots.txt proíbe o site inteiro; nada será lido")

          def pegar(url):
              if not rp.can_fetch(AGENTE, url):
                  print(f"\n### {url}\n  robots.txt não permite; pulado"); return None
              st, tipo, corpo = baixar(url)
              print(f"\n### {url}\n  HTTP {st} | {tipo} | {len(corpo)} bytes")
              if st != 200: print("  ", corpo[:400]); return None
              try: return json.loads(corpo.decode("utf-8-sig", "replace"))
              except Exception: print("  não é JSON:", corpo[:400]); return None

          def itens(d):
              # A API devolve listas em formatos variados; acha a maior lista de dicionários.
              melhor = []
              def andar(x):
                  nonlocal melhor
                  if isinstance(x, list):
                      if x and all(isinstance(i, dict) for i in x) and len(x) > len(melhor): melhor = x
                      for i in x: andar(i)
                  elif isinstance(x, dict):
                      for v in x.values(): andar(v)
              andar(d); return melhor

          def tem_gilmar(x): return "GILMAR" in json.dumps(x, ensure_ascii=False).upper()

          # Achados da primeira execução: MSF 129/2002, processo 2694474,
          # matéria 50137, aprovada no plenário em 22/05/2002.
          PROC, MAT, DIA = 2694474, 50137, "2002-05-22"

          def andar(x, achar, caminho=""):
              if isinstance(x, dict):
                  achar(x, caminho)
                  for k, v in x.items(): andar(v, achar, f"{caminho}/{k}")
              elif isinstance(x, list):
                  for i in x: andar(i, achar, caminho)

          VOTO = re.compile(r"vot|aprov|plen[áa]r|sim\b|escrut|sabatina|parecer|resultado|placar", re.I)

          # 1) Tramitação: todo texto que fale de votação, com a data.
          d = pegar(f"{API}/processo/{PROC}")
          if d is not None:
              print("  chaves:", sorted(d.keys()) if isinstance(d, dict) else type(d))
              def informe(o, caminho):
                  for campo in ("descricao", "texto", "descricaoSituacao", "descricaoAcao", "textoInformeLegislativo"):
                      t = o.get(campo)
                      if isinstance(t, str) and VOTO.search(t):
                          print(f"   [{caminho}] {o.get('data') or o.get('dataInicio') or ''} | {t[:700]}")
                  if o.get("url") or o.get("urlDocumento"):
                      print(f"   doc [{caminho}] {o.get('tipoDocumento') or o.get('tipo') or ''} | {o.get('descricao') or o.get('ementa') or ''} | {o.get('url') or o.get('urlDocumento')}")
              andar(d, informe)

          # 2) Votações ligadas ao processo ou daquele dia (sem a lista de votos).
          for url in (f"{API}/votacao?idProcesso={PROC}", f"{API}/votacao?codigoMateria={MAT}",
                      f"{API}/votacao?dataInicio={DIA}&dataFim={DIA}",
                      f"{API}/materia/votacoes/{MAT}",
                      f"{API}/plenario/lista/votacao/{DIA.replace('-', '')}/{DIA.replace('-', '')}"):
              d = pegar(url)
              if d is None: continue
              lista = d if isinstance(d, list) else []
              if not lista:
                  def votacao(o, caminho):
                      if any(k in o for k in ("totalVotosSim", "TotalVotosSim", "QuantidadeVotosSim", "Resultado", "resultadoVotacao", "DescricaoVotacao")):
                          lista.append(o)
                  andar(d, votacao)
              print(f"  {len(lista)} votações")
              for v in lista:
                  if not isinstance(v, dict): continue
                  resumo = {k: x for k, x in v.items() if not isinstance(x, (list, dict))}
                  print("  ", json.dumps(resumo, ensure_ascii=False)[:1200])
          PY

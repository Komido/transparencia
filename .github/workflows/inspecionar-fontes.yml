name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python3 -m pip install --quiet openpyxl==3.1.5

      # Emendas parlamentares por autor: os tipos de recebedor (natureza
      # jurídica) e se os nomes dos autores batem com os da cota parlamentar.
      - name: Portal da Transparência, emendas por autor e recebedor
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/em && cd /tmp/em
          curl -sSL --max-time 600 -A "ArrecadometroBrasil/1.0 (dados publicos)" -o em.zip -w "HTTP %{http_code} %{size_download} bytes\n" \
            "https://dadosabertos-download.cgu.gov.br/PortalDaTransparencia/saida/emendas-parlamentares/EmendasParlamentares.zip" || exit 0
          python3 - em.zip "$GITHUB_WORKSPACE/site/dados/cota" <<'PY'
          import collections, csv, io, json, sys, unicodedata, zipfile
          def chave(n):
              t = unicodedata.normalize("NFKD", n or "")
              t = "".join(c for c in t if not unicodedata.combining(c)).upper()
              for c in "'`´-.":
                  t = t.replace(c, " ")
              return " ".join(t.split())
          z = zipfile.ZipFile(sys.argv[1])
          leitor = csv.DictReader(io.StringIO(z.read("EmendasParlamentares_PorFavorecido.csv").decode("latin-1")), delimiter=";")
          nat, tipo, temenda = collections.Counter(), collections.Counter(), collections.Counter()
          autores = collections.defaultdict(collections.Counter)
          codigos = collections.defaultdict(set)
          for r in leitor:
              ano = r["Ano/Mês"][:4]
              if ano < "2023":
                  continue
              v = float((r["Valor Recebido"] or "0").replace(".", "").replace(",", "."))
              nat[r["Natureza Jurídica"]] += v
              tipo[r["Tipo Favorecido"]] += v
              temenda[r["Tipo de Emenda"]] += v
              autores[ano][r["Nome do Autor da Emenda"]] += v
              codigos[r["Nome do Autor da Emenda"]].add(r.get("Código do Autor da Emenda"))
          bi = lambda c: [(k, round(v / 1e9, 3)) for k, v in c.most_common()]
          print("natureza jurídica (R$ bi, 2023 em diante):"); [print("  ", x) for x in bi(nat)]
          print("tipo favorecido:", bi(tipo))
          print("tipo de emenda:", bi(temenda))
          print("autores com mais de um código:", [(a, sorted(c)) for a, c in codigos.items() if len(c) > 1][:20])
          for ano in sorted(autores):
              try:
                  cota = json.load(open(f"{sys.argv[2]}/{ano}.json"))
              except OSError:
                  continue
              nomes = collections.defaultdict(list)
              for casa in ("camara", "senado"):
                  for p in cota[casa]["parlamentares"]:
                      nomes[chave(p["nome"])].append((casa, p["id"], p["uf"]))
              total = sum(autores[ano].values())
              ligados = {a: v for a, v in autores[ano].items() if chave(a) in nomes}
              repetidos = [(a, nomes[chave(a)]) for a in ligados if len(nomes[chave(a)]) > 1]
              fora = sorted(((a, v) for a, v in autores[ano].items() if a not in ligados), key=lambda x: -x[1])
              print(f"== {ano}: {len(autores[ano])} autores, R$ {total / 1e9:.2f} bi; ligados à cota: {len(ligados)} autores, R$ {sum(ligados.values()) / 1e9:.2f} bi")
              print("   nome igual a mais de um parlamentar:", repetidos)
              print("   maiores sem ligação:", [(a, round(v / 1e6, 1)) for a, v in fora[:45]])
          PY


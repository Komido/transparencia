name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python3 -m pip install --quiet openpyxl==3.1.5

      # Portal da Transparência: o endereço de download das viagens (que
      # redireciona para o arquivo) aceita a identificação simples do projeto,
      # sem começo de navegador? Só os cabeçalhos, sem baixar o arquivo. O
      # servidor de arquivos da CGU já aceitou (BPC, 17/11/2026).
      - name: Portal da Transparência, identificação do projeto
        continue-on-error: true
        run: |
          set -u
          AGENTE="ArrecadometroBrasil/1.0 (dados publicos; github.com/Komido/transparencia)"
          for url in \
            "https://portaldatransparencia.gov.br/download-de-dados/viagens/2026" \
            "https://dadosabertos-download.cgu.gov.br/PortalDaTransparencia/saida/cpgf/202609_CPGF.zip" \
            "https://dadosabertos-download.cgu.gov.br/PortalDaTransparencia/saida/despesas-execucao/202609_Despesas.zip"; do
            echo "=== $url"
            curl -sS -o /dev/null -D - --max-time 120 -A "$AGENTE" -r 0-1023 "$url" | grep -iE "^HTTP|^location|^content-type|^content-length|^content-range" || echo "falhou"
          done

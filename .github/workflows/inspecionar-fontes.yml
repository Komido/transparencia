name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      # Câmaras municipais paulistas no arquivo anual de despesas do TCE-SP:
      # quais colunas existem, se dá para saber o que é cada pagamento
      # (salário, diária, verba indenizatória) e quanto pesa o arquivo. Nomes
      # de pessoas físicas aparecem só como iniciais no registro.
      - name: TCE-SP, despesas de 2025, colunas e câmaras
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/sp && cd /tmp/sp
          AGENTE="ArrecadometroBrasil/1.0 (dados publicos; github.com/Komido/transparencia)"
          curl -sSL --max-time 1800 -A "$AGENTE" -o d.zip -w "despesas-2025.zip: HTTP %{http_code} %{size_download} bytes em %{time_total}s\n" \
            "https://transparencia.tce.sp.gov.br/sites/default/files/conjunto-dados/despesas-2025.zip"
          python3 - d.zip <<'PY'
          import collections, csv, io, re, sys, time, zipfile
          csv.field_size_limit(10_000_000)
          z = zipfile.ZipFile(sys.argv[1])
          for i in z.infolist(): print(f"  {i.filename}: {i.file_size / 1e6:.0f} MB descompactado, {i.compress_size / 1e6:.0f} MB compactado")
          nome = max(z.infolist(), key=lambda i: i.file_size).filename
          bruto = z.open(nome).read(300_000)
          cod = "utf-8-sig"
          try: bruto.decode(cod)
          except UnicodeDecodeError: cod = "latin-1"
          primeira = bruto.decode(cod, "replace").splitlines()[0]
          sep = max(";,\t|", key=primeira.count)
          print(f"arquivo {nome}, codificação {cod}, separador {sep!r}")
          def esconder(linha):
              d = dict(linha)
              ident = " ".join(str(v) for k, v in d.items() if "fornecedor" in k.lower() or "credor" in k.lower())
              if re.search(r"PESSOA F[IÍ]SICA|CPF", ident, re.I):
                  for k in d:
                      if re.search(r"nm_|nome|ds_despesa", k, re.I) and d[k]:
                          d[k] = " ".join(p[0] + "." for p in str(d[k]).split())
              return d
          leitor = csv.DictReader(io.TextIOWrapper(z.open(nome), encoding=cod, newline="", errors="replace"), delimiter=sep)
          cols = leitor.fieldnames
          print(f"colunas ({len(cols)}): {cols}")
          org = next((c for c in cols if "orgao" in c.lower()), None)
          mun = next((c for c in cols if "municipio" in c.lower()), None)
          val = next((c for c in cols if c.lower().startswith("vl_")), None)
          tipo = next((c for c in cols if c.lower() in ("tp_despesa", "evento")), None)
          forn = next((c for c in cols if "identificador" in c.lower() or "id_fornecedor" in c.lower()), None)
          baixa = [c for c in cols if re.search(r"elemento|funcao|programa|acao|fonte|modalidade|tp_|evento|natureza|categoria|grupo|aplicacao", c, re.I)]
          print(f"órgão={org} município={mun} valor={val} tipo={tipo} fornecedor={forn}; contadas: {baixa}")
          def num(t):
              t = (t or "").strip()
              if "," in t: t = t.replace(".", "").replace(",", ".")
              try: return float(t)
              except ValueError: return 0.0
          total = 0; cam = 0; inicio = time.time()
          camaras = set(); por_tipo = collections.Counter(); valor_tipo = collections.Counter()
          cont = {c: collections.Counter() for c in baixa}
          pf_elem = collections.Counter(); exemplos = []
          for l in leitor:
              total += 1
              if total <= 2: print("exemplo geral:", esconder(l))
              o = (l.get(org) or "") if org else ""
              if "MARA MUNICIPAL" not in o.upper(): continue
              cam += 1; camaras.add(o)
              t = l.get(tipo, "") if tipo else ""
              por_tipo[t] += 1; valor_tipo[t] += num(l.get(val)) if val else 0
              for c in baixa: cont[c][l.get(c)] += 1
              elem = next((l[c] for c in cols if "elemento" in c.lower()), "")
              if forn and re.search(r"F[IÍ]SICA|CPF", l.get(forn) or "", re.I): pf_elem[elem] += 1
              if "AMPARO" in o.upper() and len(exemplos) < 25: exemplos.append(esconder(l))
          print(f"\nlinhas: {total}; das câmaras: {cam}; câmaras distintas: {len(camaras)}; leitura em {time.time() - inicio:.0f}s")
          print("tipo de lançamento nas câmaras (linhas, R$ bi):", [(k, n, round(valor_tipo[k] / 1e9, 2)) for k, n in por_tipo.most_common()])
          for c in baixa:
              print(f"\n{c} nas câmaras ({len(cont[c])} valores distintos):")
              for v, n in cont[c].most_common(25): print(f"  {n:8d}  {v}")
          print("\npagamentos a pessoa física nas câmaras, por elemento:")
          for v, n in pf_elem.most_common(20): print(f"  {n:8d}  {v}")
          print("\nCâmara de Amparo, exemplos (pessoas físicas só com iniciais):")
          for x in exemplos: print("  ", x)
          PY

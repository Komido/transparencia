name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF e Excel) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python3 -m pip install --quiet openpyxl==3.1.5

      - name: Portal da Transparência (cartão, viagens e execução da despesa)
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/cgu && cd /tmp/cgu
          cat > resumo.py <<'PY'
          import csv, io, sys, zipfile, collections, re
          def numero(t):
              t = (t or '').strip().replace('.', '').replace(',', '.')
              try: return float(t)
              except ValueError: return None
          caminho = sys.argv[1]
          with zipfile.ZipFile(caminho) as z:
              for info in z.infolist():
                  print(f'  arquivo {info.filename}: {info.file_size:,} bytes')
                  bruto = z.read(info.filename)
                  for cod in ('utf-8-sig', 'cp1252', 'latin-1'):
                      try:
                          texto = bruto.decode(cod); break
                      except UnicodeDecodeError:
                          continue
                  print('  codificação', cod)
                  leitor = csv.DictReader(io.StringIO(texto, newline=''), delimiter=';')
                  cols = leitor.fieldnames or []
                  print('  colunas:', cols)
                  col_org = next((c for c in cols if re.search(r'(?i)nome.*rg.o superior', c)), None)
                  col_valor = [c for c in cols if re.search(r'(?i)^valor', c)]
                  col_cargo = next((c for c in cols if re.search(r'(?i)cargo', c)), None)
                  col_trans = next((c for c in cols if re.search(r'(?i)transa', c) and 'DATA' not in c.upper()), None)
                  n = 0
                  somas = collections.defaultdict(lambda: collections.defaultdict(float))
                  cargos = collections.Counter()
                  trans = collections.Counter()
                  sigilo = 0
                  for linha in leitor:
                      n += 1
                      if col_org:
                          for c in col_valor:
                              v = numero(linha.get(c))
                              if v is not None:
                                  somas[c][linha.get(col_org)] += v
                      if col_cargo:
                          cargos[(linha.get(col_cargo) or '').strip()] += 1
                      if col_trans:
                          trans[(linha.get(col_trans) or '').strip()] += 1
                      if any('SIGILO' in (linha.get(c) or '').upper() for c in cols[:12]):
                          sigilo += 1
                  print('  linhas', n, '| com sigilo', sigilo)
                  for c, por in somas.items():
                      total = sum(por.values())
                      print(f'  {c}: total {total:,.2f}; maiores órgãos superiores:', [(k, round(v)) for k, v in sorted(por.items(), key=lambda x: -x[1])[:8]])
                  if cargos:
                      print('  cargos mais comuns:', cargos.most_common(8))
                      print('  cargos com MINISTRO:', [(k, v) for k, v in cargos.items() if 'MINISTR' in k.upper()][:10])
                  if trans:
                      print('  tipos de transação:', trans.most_common(8))
          PY
          baixar() { curl -sSL --max-time 900 -A "Mozilla/5.0 (X11; Linux x86_64)" -o "$2" -w "%{http_code} %{size_download} bytes %{content_type} %{url_effective}\n" "$1" || echo "falhou"; }
          for par in \
            "cpgf/202509 cpgf.zip" \
            "viagens/2025 viagens.zip" \
            "despesas-execucao/202509 execucao.zip"; do
            set -- $par
            url="https://portaldatransparencia.gov.br/download-de-dados/$1"
            echo "=== $url"
            baixar "$url" "$2"
            if unzip -tq "$2" > /dev/null 2>&1; then
              python3 resumo.py "$2"
            else
              echo "não é zip:"; head -c 600 "$2"; echo
            fi
            rm -f "$2"
          done

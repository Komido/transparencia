name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF e Excel) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python3 -m pip install --quiet openpyxl==3.1.5

      - name: Datas de crises (CODACE/FGV e emergência da covid-19)
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/crises && cd /tmp/crises
          texto() { python3 -c "import sys,html,re; t=open(sys.argv[1],'rb').read().decode('utf-8','replace'); t=re.sub(r'(?is)<(script|style).*?</\\1>',' ',t); t=re.sub(r'(?i)<br\\s*/?>|</(p|tr|li|div|h[1-6]|td)>','\\n',t); t=re.sub(r'<[^>]+>',' ',t); print(html.unescape(t))" "$1"; }
          for url in \
            "https://portal.fgv.br/codace" \
            "https://blogdoibre.fgv.br/posts/datacao-dos-ciclos-economicos-brasileiros-de-1970-2023" \
            "https://portal.fgv.br/sites/portal.fgv.br/files/u2104/comunicado_do_comite_de_datacao_de_ciclos_economicos_-_29_06_2020.pdf" \
            "https://bvsms.saude.gov.br/bvs/saudelegis/gm/2020/prt0188_04_02_2020.html" \
            "https://www.in.gov.br/en/web/dou/-/portaria-gm/ms-n-913-de-22-de-abril-de-2022-394545491"; do
            echo "=== $url"
            curl -sSL --max-time 90 -A "Mozilla/5.0 (X11; Linux x86_64)" -o pagina -w "%{http_code} %{size_download} bytes %{content_type}\n" "$url" || { echo falhou; continue; }
            if file -b --mime-type pagina | grep -q pdf; then pdftotext -layout pagina pagina.txt; else texto pagina > pagina.txt; fi
            grep -n -i -E "trimestre|recess|pico|vale|vig.ncia|encerra|declara|emerg.ncia em sa.de p.blica" pagina.txt | sed 's/[[:space:]]\+/ /g' | head -60
          done

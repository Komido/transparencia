name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF e Excel) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python3 -m pip install --quiet openpyxl==3.1.5

      - name: Datas de crises (CODACE/FGV e emergência da covid-19)
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/crises && cd /tmp/crises
          baixar() { curl -sSL --max-time 90 -A "Mozilla/5.0 (X11; Linux x86_64)" -o "$2" -w "%{http_code} %{size_download} bytes\n" "$1"; }
          echo "=== Quadro 1 do IBRE/FGV (datação trimestral, com a cronologia do CODACE)"
          baixar "https://blogdoibre.fgv.br/posts/datacao-dos-ciclos-economicos-brasileiros-de-1970-2023" blog.html
          python3 - blog.html <<'PY'
          import sys, html, re
          t = open(sys.argv[1], 'rb').read().decode('utf-8', 'replace')
          t = re.sub(r'(?is)<(script|style).*?</\1>', ' ', t)
          t = re.sub(r'(?i)<br\s*/?>|</(p|tr|li|div|h[1-6]|td|th)>', '\n', t)
          t = html.unescape(re.sub(r'<[^>]+>', ' ', t))
          ini, fim = t.find('Quadro 1'), t.find('Quadro 2')
          celulas = [re.sub(r'\s+', ' ', x).strip() for x in t[ini:fim].split('\n')]
          celulas = [x for x in celulas if x]
          linha = []
          for x in celulas:
              if x in ('Recessão', 'Expansão') and linha:
                  print(' | '.join(linha)); linha = []
              linha.append(x)
          print(' | '.join(linha))
          PY
          for url in \
            "https://www.in.gov.br/en/web/dou/-/portaria-n-188-de-3-de-fevereiro-de-2020-241408388" \
            "https://www.in.gov.br/en/web/dou/-/portaria-gm/ms-n-913-de-22-de-abril-de-2022-394545491"; do
            echo "=== $url"
            baixar "$url" portaria.html || continue
            python3 -c "import sys,html,re; t=open(sys.argv[1],'rb').read().decode('utf-8','replace'); t=re.sub(r'(?is)<(script|style).*?</\\1>',' ',t); t=html.unescape(re.sub(r'<[^>]+>','\n',t)); [print(re.sub(r'\\s+',' ',l).strip()) for l in t.split('\n') if re.search(r'Art\\. ?[0-9]|vigor|Publicado em|Edição', l)]" portaria.html | head -30
          done

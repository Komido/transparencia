name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python3 -m pip install --quiet openpyxl==3.1.5

      # Senado: o serviço novo de votações (com os votos de cada senador), o de
      # processos por autor e a lista atual de senadores com partido.
      - name: Senado Federal, serviços novos
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/sen && cd /tmp/sen
          for url in \
            "https://legis.senado.leg.br/dadosabertos/votacao?dataInicio=2025-03-01&dataFim=2025-03-31" \
            "https://legis.senado.leg.br/dadosabertos/votacao?dataInicio=2025-01-01&dataFim=2025-12-31" \
            "https://legis.senado.leg.br/dadosabertos/votacao?codigoParlamentar=5012&dataInicio=2025-01-01&dataFim=2025-12-31" \
            "https://legis.senado.leg.br/dadosabertos/processo?codigoParlamentarAutor=5012&dataInicioApresentacao=2025-01-01&dataFimApresentacao=2025-12-31" \
            "https://legis.senado.leg.br/dadosabertos/processo?codigoParlamentarAutor=5012&ano=2025" \
            "https://legis.senado.leg.br/dadosabertos/senador/lista/atual.json"; do
            echo "=== $url"
            curl -sSL --max-time 180 -A "ArrecadometroBrasil/1.0 (dados publicos)" -H "Accept: application/json" -o r.json -w "HTTP %{http_code} %{size_download} bytes\n" "$url" || continue
            python3 - r.json <<'PY'
          import collections, json, sys
          bruto = open(sys.argv[1], "rb").read()
          try:
              d = json.loads(bruto)
          except Exception as erro:
              print("não é JSON:", erro, bruto[:300]); raise SystemExit
          if isinstance(d, list):
              print("lista de", len(d))
              if d and isinstance(d[0], dict):
                  print("chaves:", list(d[0].keys()))
                  x = d[0]
                  print({k: (str(v)[:160]) for k, v in x.items() if not isinstance(v, (list, dict))})
                  for k, v in x.items():
                      if isinstance(v, list):
                          print(f"  {k}: lista de {len(v)}; primeiro:", json.dumps(v[0], ensure_ascii=False)[:500] if v else None)
                      elif isinstance(v, dict):
                          print(f"  {k}:", json.dumps(v, ensure_ascii=False)[:500])
                  for campo in ("tipoDocumento", "siglaTipoDeliberacao", "casaSessao", "resultadoVotacao", "votacaoSecreta"):
                      if campo in x:
                          print(f"  {campo}:", collections.Counter(str(i.get(campo)) for i in d).most_common(10))
                  datas = [i.get("dataApresentacao") or i.get("dataSessao") for i in d]
                  datas = [str(t) for t in datas if t]
                  if datas:
                      print("  datas de", min(datas), "a", max(datas))
          else:
              print(json.dumps(d, ensure_ascii=False)[:1500])
          PY
          done


name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # TCE-RS: o arquivo anual "Despesa orçamentária por empenhos" (todos os
      # municípios) tem valor pago, código da cidade e um jeito seguro de achar
      # a Câmara? Só leitura. O robots.txt do portal proíbe /api/ e pede 10
      # segundos entre pedidos: são poucos pedidos, todos fora de /api/, com
      # 10 segundos de intervalo. Nomes de pessoas não vão para o registro.
      - name: TCE-RS, código das cidades e salário dos vereadores no arquivo de 2025
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import collections, csv, html.parser, io, os, re, time, urllib.parse, urllib.request, urllib.robotparser, zipfile
          AGENTE = "ArrecadometroBrasil/1.0 (dados publicos)"
          BASE = "https://dados.tce.rs.gov.br"
          rp = urllib.robotparser.RobotFileParser()
          ultimo = [0.0]
          def pedir(url, cab=None, tempo=300):
              espera = 10 - (time.time() - ultimo[0])
              if espera > 0: time.sleep(espera)
              ultimo[0] = time.time()
              if url.startswith(BASE) and url != BASE + "/robots.txt" and not rp.can_fetch(AGENTE, url):
                  raise SystemExit(f"robots.txt não permite {url}")
              return urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": AGENTE, **(cab or {})}), timeout=tempo)
          with pedir(BASE + "/robots.txt") as r:
              linhas = r.read().decode("utf-8", "replace").splitlines()
          rp.parse(linhas)
          print("robots.txt:", [l for l in linhas if l.strip() and not l.startswith("#")][:12], "| crawl-delay:", rp.crawl_delay(AGENTE))

          class Links(html.parser.HTMLParser):
              def __init__(self): super().__init__(); self.links = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "a" and a.get("href"): self.links.append(a["href"])
          def recursos(conjunto):
              with pedir(f"{BASE}/dataset/{conjunto}") as r:
                  p = Links(); p.feed(r.read().decode("utf-8", "replace"))
              return sorted({urllib.parse.urljoin(BASE, h) for h in p.links if re.search(r"/dados/.+\.(csv|zip|7z|json|xml)", h)})

          # Tabelas de apoio que liguem o código do órgão à cidade.
          class Conjuntos(html.parser.HTMLParser):
              def __init__(self): super().__init__(); self.nomes = []
              def handle_starttag(self, tag, attrs):
                  h = dict(attrs).get("href") or ""
                  if tag == "a" and h.startswith("/dataset/") and "?" not in h: self.nomes.append(h.split("/")[2])
          for termo in ("orgaos", "municipios", "auxiliar", "entidades"):
              with pedir(f"{BASE}/dataset?q={termo}&tags=Auxiliar") as r:
                  c = Conjuntos(); c.feed(r.read().decode("utf-8", "replace"))
              print(f"busca {termo!r} (etiqueta Auxiliar): {sorted(set(c.nomes))[:30]}")
          with pedir(f"{BASE}/dataset?tags=Auxiliar") as r:
              c = Conjuntos(); c.feed(r.read().decode("utf-8", "replace"))
          aux = sorted(set(c.nomes))
          print(f"conjuntos com a etiqueta Auxiliar: {aux}")
          for conjunto in [n for n in aux if re.search(r"orgao|munic|entidade", n)][:3]:
              urls = recursos(conjunto)
              print(f"\n{conjunto}: {urls}")
              csvs = [u for u in urls if u.endswith(".csv")]
              if csvs:
                  with pedir(csvs[0]) as r: t = r.read(300_000)
                  try: texto = t.decode("utf-8-sig")
                  except UnicodeDecodeError: texto = t.decode("latin-1")
                  for l in texto.splitlines()[:12]: print("   ", l[:220])

          # Câmaras no arquivo de 2025: nomes dos órgãos (instituições, não
          # pessoas), total pago em 2025 e como o salário dos vereadores aparece.
          urls = recursos("despesa-orcamentaria-por-empenhos-2025")
          url = next(u for u in urls if u.endswith(".csv.zip"))
          with pedir(url, tempo=60) as r, open("/tmp/rs.zip", "wb") as fh:
              while True:
                  b = r.read(1 << 20)
                  if not b: break
                  fh.write(b)
          z = zipfile.ZipFile("/tmp/rs.zip")
          nome = z.infolist()[0].filename
          leitor = csv.reader(io.TextIOWrapper(z.open(nome), encoding="utf-8-sig", newline="", errors="replace"))
          cab = next(leitor); I = {c: cab.index(c) for c in cab}
          orgaos = collections.Counter(); pago = 0.0; rubricas = collections.Counter(); pf = collections.Counter()
          inicio = time.time(); n = 0
          for l in leitor:
              n += 1
              if l[I["tp_unidade"]] != "CMM" or l[I["tipo_operacao"]] != "P" or l[I["ano_operacao"]] != "2025": continue
              v = float(l[I["vl_pagamento"]] or 0)
              pago += v
              orgaos[(l[I["cd_orgao"]], l[I["nome_orgao"]])] += v
              chave = (l[I["cd_elemento"]], l[I["cd_rubrica"]], l[I["ds_rubrica"]])
              rubricas[chave] += v
              if l[I["tp_pessoa"]] == "PF": pf[chave] += v
          print(f"\nlidas {n} linhas em {(time.time() - inicio) / 60:.1f} min")
          print(f"câmaras (cd_orgao distintos) com pagamento em 2025: {len({o for o, _ in orgaos})}; total pago: R$ {pago / 1e6:.1f} milhões")
          print("exemplos de nome_orgao:", sorted({nm for _, nm in orgaos})[:25])
          prefixos = collections.Counter(re.sub(r"\s+DE\s+.*$|\s+D[AO]S?\s+.*$", "", nm.strip().upper()) for _, nm in orgaos)
          print("começo dos nomes:", prefixos.most_common(10))
          print("\nrubricas de pessoal (3.1) nas câmaras, por valor pago (R$ mi | a pessoa física):")
          for (el, rub, ds), v in rubricas.most_common(200):
              if el.startswith("3.1"): print(f"  {v / 1e6:8.1f} | {pf[(el, rub, ds)] / 1e6:7.1f} | {el} {rub} {ds}")
          print("\noutras rubricas mais pagas:")
          for (el, rub, ds), v in [x for x in rubricas.most_common(60) if not x[0][0].startswith("3.1")][:25]:
              print(f"  {v / 1e6:8.1f} | {el} {rub} {ds}")
          PY

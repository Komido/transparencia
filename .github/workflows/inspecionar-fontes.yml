name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python3 -m pip install --quiet openpyxl==3.1.5

      # Emendas pagas ao Banco do Brasil (Portal) contra as transferências
      # especiais do Transferegov (emendas Pix): os totais por ano batem? os
      # códigos de emenda são os mesmos? há pagamento direto à prefeitura das
      # mesmas emendas (risco de contar duas vezes)? Só totais e alguns
      # códigos de emenda (públicos) no registro.
      - name: Emendas via Banco do Brasil e transferências especiais
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/em && cd /tmp/em
          AGENTE="ArrecadometroBrasil/1.0 (dados publicos; github.com/Komido/transparencia)"
          curl -sSL --max-time 900 -A "$AGENTE" -o em.zip -w "Portal: HTTP %{http_code} %{size_download} bytes\n" \
            "https://dadosabertos-download.cgu.gov.br/PortalDaTransparencia/saida/emendas-parlamentares/EmendasParlamentares.zip"
          python3 - em.zip <<'PY'
          import collections, csv, io, json, sys, time, urllib.request, zipfile
          AGENTE = "ArrecadometroBrasil/1.0 (dados publicos; github.com/Komido/transparencia)"
          BB = "00000000000191"
          z = zipfile.ZipFile(sys.argv[1])
          nome = [n for n in z.namelist() if "PorFavorecido" in n][0]
          f = io.TextIOWrapper(z.open(nome), encoding="latin-1", newline="")
          r = csv.DictReader(f, delimiter=";")
          print("colunas:", r.fieldnames)
          def num(t):
              t = (t or "").strip()
              return float(t.replace(".", "").replace(",", ".")) if "," in t else float(t or 0)
          bb_ano_tipo = collections.Counter(); bb_codigos = collections.defaultdict(float)
          direto_codigos = collections.defaultdict(float); natureza_bb = collections.Counter()
          for l in r:
              am = (l.get("Ano/Mês") or "").strip()
              if len(am) < 4 or int(am[:4]) < 2023: continue
              ano = int(am[:4]); cnpj = "".join(ch for ch in l["Código do Favorecido"] if ch.isdigit())
              v = num(l["Valor Recebido"]); cod = l["Código da Emenda"].strip()
              if cnpj == BB:
                  bb_ano_tipo[(ano, l["Tipo de Emenda"].strip())] += v
                  bb_codigos[(ano, cod)] += v
              elif "Munic" in (l.get("Natureza Jurídica") or "") or "Fundo P" in (l.get("Natureza Jurídica") or ""):
                  direto_codigos[cod] += v
          print("\n## Portal: pago ao Banco do Brasil, por ano e tipo de emenda (R$ bi)")
          for (a, t), v in sorted(bb_ano_tipo.items()): print(f"  {a} {t}: {v/1e9:.3f}")
          print("exemplos de código de emenda pagos ao BB:", [c for (_, c) in list(bb_codigos)[:5]])
          # Transferegov: todas as linhas das quatro tabelas, em páginas.
          BASE = "https://api.transferegov.gestao.gov.br/transferenciasespeciais/"
          def tabela(nome, campos, ordem):
              linhas, pos = [], 0
              while True:
                  url = f"{BASE}{nome}?select={campos}&order={ordem}&limit=10000&offset={pos}"
                  for t in range(5):
                      try:
                          with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": AGENTE}), timeout=120) as resp:
                              pagina = json.load(resp); break
                      except Exception as e:
                          print("  tentativa", t + 1, nome, pos, e); time.sleep(5 * (t + 1))
                  else:
                      raise SystemExit(f"falhou {nome} {pos}")
                  linhas += pagina; pos += len(pagina)
                  if len(pagina) < 10000: break
              print(f"{nome}: {len(linhas)} linhas")
              return linhas
          planos = tabela("plano_acao_especial", "id_plano_acao,ano_plano_acao,cnpj_beneficiario_plano_acao,uf_beneficiario_plano_acao,nome_beneficiario_plano_acao,numero_emenda_parlamentar_plano_acao,valor_custeio_plano_acao,valor_investimento_plano_acao", "id_plano_acao")
          empenhos = tabela("empenho_especial", "id_empenho,id_plano_acao,valor_empenho,cnpj_beneficiario_empenho", "id_empenho")
          dhs = tabela("documento_habil_especial", "id_dh,id_empenho,valor_dh,data_emissao_dh,situacao_dh", "id_dh")
          obs = tabela("ordem_pagamento_ordem_bancaria_especial", "id_op_ob,id_dh,data_emissao_ob,situacao_op,descricao_situacao_op", "id_op_ob")
          plano = {p["id_plano_acao"]: p for p in planos}
          emp = {e["id_empenho"]: e for e in empenhos}
          print("situações das OB:", collections.Counter(o["descricao_situacao_op"] for o in obs).most_common(8))
          dh_com_ob = collections.defaultdict(list)
          for o in obs:
              if o.get("data_emissao_ob"): dh_com_ob[o["id_dh"]].append(o)
          pago_ano = collections.Counter(); pago_cod_ano = collections.defaultdict(float)
          pago_tipo_benef = collections.Counter(); sem_ligacao = 0.0
          for d in dhs:
              ob = dh_com_ob.get(d["id_dh"])
              if not ob: continue
              ano = int(min(o["data_emissao_ob"] for o in ob)[:4])
              e = emp.get(d["id_empenho"]); p = plano.get(e["id_plano_acao"]) if e else None
              v = float(d["valor_dh"] or 0)
              if not p: sem_ligacao += v; continue
              pago_ano[ano] += v
              cod = (p["numero_emenda_parlamentar_plano_acao"] or "").strip()
              pago_cod_ano[(ano, cod)] += v
              nome_b = (p["nome_beneficiario_plano_acao"] or "").upper()
              pago_tipo_benef["município" if nome_b.startswith("MUNICIPIO") else ("estado" if nome_b.startswith("ESTADO") or "DISTRITO FEDERAL" in nome_b else "outro")] += v
          print("\n## Transferegov: pago (documento com ordem bancária), por ano da OB (R$ bi)")
          for a in sorted(pago_ano): print(f"  {a}: {pago_ano[a]/1e9:.3f}")
          print("sem ligação a plano:", round(sem_ligacao / 1e9, 3), "bi; por tipo de beneficiário:", {k: round(v / 1e9, 3) for k, v in pago_tipo_benef.items()})
          print("exemplos de código no Transferegov:", [c for (_, c) in list(pago_cod_ano)[:5]])
          print("\n## Cruzamento por ano e código de emenda")
          for a in sorted({a for (a, _) in bb_codigos}):
              bb = {c: v for (aa, c), v in bb_codigos.items() if aa == a}
              tg = {c: v for (aa, c), v in pago_cod_ano.items() if aa == a}
              comum = set(bb) & set(tg)
              print(f"  {a}: BB R$ {sum(bb.values())/1e9:.3f} bi em {len(bb)} códigos; Transferegov R$ {sum(tg.values())/1e9:.3f} bi em {len(tg)} códigos; "
                    f"códigos em comum {len(comum)} (BB R$ {sum(bb[c] for c in comum)/1e9:.3f} bi, TG R$ {sum(tg[c] for c in comum)/1e9:.3f} bi); "
                    f"códigos do TG também pagos direto a prefeitura/fundo: {len(set(tg) & set(direto_codigos))}")
          PY

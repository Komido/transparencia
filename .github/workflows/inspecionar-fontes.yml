name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python3 -m pip install --quiet openpyxl==3.1.5

      # Emendas pagas ao Banco do Brasil em 2023 e 2024 (Portal): as outras
      # tabelas do mesmo arquivo dizem para onde foi o dinheiro? Lista as 6
      # tabelas (colunas e linhas) e, para os códigos de emenda pagos ao BB,
      # o que cada tabela traz: lugar de aplicação, convenentes, documentos.
      # Só totais e nomes de colunas no registro.
      - name: Emendas pagas ao Banco do Brasil, outras tabelas do Portal
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/em && cd /tmp/em
          AGENTE="ArrecadometroBrasil/1.0 (dados publicos; github.com/Komido/transparencia)"
          curl -sSL --max-time 900 -A "$AGENTE" -o em.zip -w "Portal: HTTP %{http_code} %{size_download} bytes\n" \
            "https://dadosabertos-download.cgu.gov.br/PortalDaTransparencia/saida/emendas-parlamentares/EmendasParlamentares.zip"
          python3 - em.zip <<'PY'
          import collections, csv, io, sys, zipfile
          BB = "00000000000191"
          z = zipfile.ZipFile(sys.argv[1])
          def ler(nome):
              return csv.DictReader(io.TextIOWrapper(z.open(nome), encoding="latin-1", newline=""), delimiter=";")
          def num(t):
              t = (t or "").strip()
              return float(t.replace(".", "").replace(",", ".")) if "," in t else float(t or 0)
          for info in z.infolist():
              r = ler(info.filename); n = sum(1 for _ in r)
              print(f"\n=== {info.filename}: {info.file_size:,} bytes, {n:,} linhas\ncolunas: {r.fieldnames}")
          fav = [n for n in z.namelist() if "PorFavorecido" in n][0]
          bb = collections.defaultdict(float)
          for l in ler(fav):
              am = (l["Ano/Mês"] or "").strip()
              if len(am) >= 4 and am[:4] in ("2023", "2024") and "".join(c for c in l["Código do Favorecido"] if c.isdigit()) == BB:
                  bb[l["Código da Emenda"].strip()] += num(l["Valor Recebido"])
          total = sum(bb.values())
          print(f"\n## códigos pagos ao BB em 2023-2024: {len(bb):,}, R$ {total/1e9:.2f} bi")
          # Em cada outra tabela: quanto do valor do BB tem o código lá, e o
          # que as colunas de lugar e de recebedor trazem para esses códigos.
          for nome in z.namelist():
              if nome == fav: continue
              r = ler(nome)
              col_cod = next((c for c in (r.fieldnames or []) if "digo da Emenda" in c), None)
              if not col_cod: print(f"\n{nome}: sem coluna de código da emenda"); continue
              achados = set(); amostra = collections.defaultdict(collections.Counter)
              interesse = [c for c in r.fieldnames if any(k in c.lower() for k in ("munic", "local", "uf", "convenente", "favorecido", "natureza", "tipo", "fase", "esfera", "modalidade", "fun"))]
              for l in r:
                  c = (l.get(col_cod) or "").strip()
                  if c in bb:
                      achados.add(c)
                      for k in interesse:
                          amostra[k][(l.get(k) or "").strip()[:40]] += 1
              v = sum(bb[c] for c in achados)
              print(f"\n## {nome}: {len(achados):,} dos códigos do BB, R$ {v/1e9:.2f} bi ({100*v/max(total,1):.0f}% do valor)")
              for k in interesse:
                  print(f"  {k}: {amostra[k].most_common(8)}")
          PY

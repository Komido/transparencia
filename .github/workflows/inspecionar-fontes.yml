name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python3 -m pip install --quiet openpyxl==3.1.5

      # Senado: legenda oficial dos códigos de quem não votou (LS, MIS, LP,
      # NA, LAP), no relatório de votações nominais de senadores que têm esses
      # códigos. Só a parte da legenda vai para o registro.
      - name: Senado, legenda dos códigos de ausência
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/sen && cd /tmp/sen
          AGENTE="ArrecadometroBrasil/1.0 (dados publicos; github.com/Komido/transparencia)"
          for par in 2024/5376 2025/5376 2025/5924 2023/4811 2026/285; do
            url="https://legis.senado.leg.br/parlam-servicosweb/api/v1/relatorios/votacoes-nominais/ano/${par%/*}/parlamentar/${par#*/}"
            echo "=== $url"
            curl -sSL --max-time 180 -A "$AGENTE" -o r.pdf -w "HTTP %{http_code} %{content_type} %{size_download} bytes\n" "$url" || continue
            pdftotext -layout r.pdf r.txt 2>/dev/null || { echo "não é PDF"; continue; }
            echo "--- contagem dos códigos no texto:"
            grep -oE "\b(LS|MIS|LP|NA|LAP|NCom|P-NRV|AP|LC|LA|REP|AUS)\b" r.txt | sort | uniq -c | sort -rn | head -15
            echo "--- legenda:"
            grep -n -iE "legenda|licen|miss|n[aã]o compareceu|atividade|representa|partid|lider|presente|ausente" r.txt | grep -viE "^[0-9]+: *[0-9]{2}/[0-9]{2}/[0-9]{4}" | head -40
          done

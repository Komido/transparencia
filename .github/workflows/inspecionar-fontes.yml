name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Câmaras de SC, PB e BA: o que os Tribunais de Contas publicam sobre os
      # gastos das câmaras (APIs, arquivos para baixar e o portal da PB, que é
      # montado por script). Só leitura, respeitando o robots.txt e o
      # Crawl-Delay; arquivos grandes só têm o tamanho conferido.
      - name: Tribunais de Contas de SC, PB e BA (despesas das câmaras)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import collections, json, re, time, urllib.error, urllib.parse, urllib.request, urllib.robotparser

          AGENTE = "ArrecadometroBrasil/1.0 (dados publicos)"
          robots, atraso, pedidos = {}, {}, [0]

          def baixar(url, aceitar="*/*", limite=60_000_000, metodo="GET", tempo=180):
              time.sleep(atraso.get(urllib.parse.urlsplit(url).netloc, 2))
              pedidos[0] += 1
              cab = {"User-Agent": AGENTE, "Accept": aceitar}
              pedido = urllib.request.Request(url, headers=cab, method=metodo)
              inicio = time.time()
              try:
                  with urllib.request.urlopen(pedido, timeout=tempo) as r:
                      corpo = r.read(limite) if metodo == "GET" else b""
                      return r.status, dict(r.headers), r.geturl(), corpo, time.time() - inicio
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers or {}), url, e.read(3000), time.time() - inicio
              except Exception as e:
                  return 0, {}, url, repr(e).encode(), time.time() - inicio

          def permitido(url):
              p = urllib.parse.urlsplit(url); base = f"{p.scheme}://{p.netloc}"
              if base not in robots:
                  st, _, _, corpo, _ = baixar(base + "/robots.txt", "text/plain", 200_000)
                  linhas = corpo.decode("utf-8", "replace").splitlines() if st == 200 and b"<html" not in corpo[:500].lower() else []
                  print(f"\nrobots.txt de {p.netloc}: HTTP {st}" + "".join("\n    " + l for l in linhas[:25]))
                  rp = urllib.robotparser.RobotFileParser(); rp.parse(linhas)
                  atraso[p.netloc] = max(2, float(rp.crawl_delay(AGENTE) or 0))
                  grupo, proibe = None, False
                  for l in linhas:
                      k, _, v = l.split("#")[0].partition(":")
                      k, v = k.strip().lower(), v.strip()
                      if k == "user-agent": grupo = v
                      elif k == "disallow" and grupo == "*" and v == "/": proibe = True
                  robots[base] = "proibido" if proibe else rp
                  if proibe: print("    (um bloco para todos os robôs proíbe o site inteiro: nada será lido)")
              rp = robots[base]
              return rp != "proibido" and rp.can_fetch(AGENTE, url)

          def pegar(url, aceitar="*/*", mostrar=True, tempo=180):
              if not permitido(url):
                  print(f"\n### {url}\n  robots.txt não permite; pulado"); return None, None
              st, cab, final, corpo, seg = baixar(url, aceitar, tempo=tempo)
              if mostrar:
                  print(f"\n### {url}\n  HTTP {st} | {cab.get('Content-Type', '')} | {len(corpo)} bytes | {seg:.1f} s" + (f" | foi para {final}" if final != url else ""))
              if st != 200:
                  print("  ", corpo[:400]); return None, None
              tipo = cab.get("Content-Type", "").lower()
              m = re.search(r"charset=([\w-]+)", tipo)
              enc = m.group(1) if m else ("utf-8" if b"\xc3" in corpo[:200000] else "latin-1")
              return corpo.decode(enc, "replace"), final

          def texto_da_pagina(html, limite=8000):
              t = re.sub(r"<script.*?</script>|<style.*?</style>", " ", html, flags=re.S | re.I)
              t = re.sub(r"<[^>]+>", " | ", t)
              t = re.sub(r"(\s*\|\s*)+", " | ", re.sub(r"[ \t\r\n]+", " ", t))
              return t[:limite]

          def como_json(texto):
              try: return json.loads(texto)
              except Exception: return None

          def registros(dado):
              """Acha a lista de registros dentro da resposta, qualquer que seja o envelope."""
              if isinstance(dado, list): return dado, "lista na raiz"
              if isinstance(dado, dict):
                  for k, v in dado.items():
                      if isinstance(v, list) and v and isinstance(v[0], dict): return v, k
                  for k, v in dado.items():
                      if isinstance(v, dict):
                          r, c = registros(v)
                          if r: return r, f"{k}.{c}"
              return [], None

          def mostrar_registros(texto, campos_soma=(), contar=()):
              dado = como_json(texto)
              if dado is None:
                  print("  não é JSON; começo:", texto[:600]); return []
              if isinstance(dado, dict):
                  print("  chaves de topo:", {k: (type(v).__name__, (len(v) if hasattr(v, '__len__') else v)) for k, v in list(dado.items())[:12]})
              regs, onde = registros(dado)
              if not regs:
                  print("  sem lista de registros; começo:", texto[:800]); return []
              print(f"  {len(regs)} registros (em {onde}); campos: {list(regs[0].keys())}")
              for r in regs[:2]: print("   exemplo:", json.dumps(r, ensure_ascii=False)[:900])
              for c in campos_soma:
                  try: print(f"  soma de {c}: {sum(float(str(r.get(c) or 0).replace(',', '.')) for r in regs):,.2f}")
                  except Exception as e: print(f"  soma de {c}: {e}")
              for c in contar:
                  print(f"  valores de {c}:", collections.Counter(str(r.get(c)) for r in regs).most_common(25))
              return regs

          def titulo(t): print("\n" + "=" * 72 + "\n" + t + "\n" + "=" * 72)

          def num(v):
              try: return float(str(v or 0).replace(",", "."))
              except ValueError: return 0.0

          def somar_por(regs, chave, valor):
              c = collections.defaultdict(float)
              for r in regs: c[chave(r)] += num(r.get(valor))
              return sorted(c.items(), key=lambda x: -x[1])

          # ------------------------------------------------------------------
          # 21/11: câmaras de SC, PB e BA, segunda rodada. Em 17/11 a primeira
          # achou só páginas; agora segue os links das APIs, lista os arquivos para
          # baixar (só o tamanho, sem baixar) e, no portal da PB, procura nos scripts
          # da página o endereço da API. Só leitura.
          import html as html_mod
          from urllib.parse import urljoin

          def links(pagina, base):
              vistos, saida = set(), []
              for m in re.finditer(r'<a\b[^>]*href\s*=\s*["\']([^"\'#]+)["\'][^>]*>(.*?)</a>', pagina, flags=re.S | re.I):
                  url = urljoin(base, html_mod.unescape(m.group(1)).strip())
                  texto = " ".join(re.sub(r"<[^>]+>", " ", m.group(2)).split())[:90]
                  if url.startswith("http") and url not in vistos:
                      vistos.add(url); saida.append((url, texto))
              return saida

          def mostrar_links(pagina, base, filtro, maximo=60):
              achados = [(u, x) for u, x in links(pagina, base) if re.search(filtro, u + " " + x, re.I)]
              print(f"  {len(achados)} links com /{filtro[:60]}/:")
              for u, x in achados[:maximo]: print(f"   - {x or '(sem texto)'} -> {u}")
              return achados

          def tamanho(url):
              if not permitido(url): print("   robots.txt não permite:", url); return
              st, cab, _, _, _ = baixar(url, metodo="HEAD", tempo=60)
              print(f"   HEAD {url}: HTTP {st} | {cab.get('Content-Type', '')} | {cab.get('Content-Length', '?')} bytes | {cab.get('Last-Modified', '')}")

          ARQUIVO = r"\.(zip|csv|json|xlsx?|txt|gz|7z|rar)(\?|$)"
          FILTRO = r"api|endpoint|json|csv|zip|download|dados.?abertos|despesa|empenho|pagamento|esfinge|sagres|transpar"

          titulo("SC: página de APIs de dados abertos do TCE-SC")
          pag, final = pegar("https://www.tcesc.tc.br/apis-dados-abertos", "text/html")
          if pag:
              print("  texto:", texto_da_pagina(pag, 6000))
              achados = mostrar_links(pag, final, r"servicos\.tcesc|api|endpoint|json")
              no_texto = set(re.findall(r"https?://servicos\.tcesc\.tc\.br/[^\s\"'<>)]+", html_mod.unescape(pag)))
              for u in sorted(no_texto)[:40]: print("   endereço no texto:", u)
              alvos = sorted({u for u, _ in achados if "servicos.tcesc" in u} | no_texto)
              for u in alvos[:15]:
                  corpo, _ = pegar(u, "application/json", tempo=90)
                  if corpo: mostrar_registros(corpo)

          titulo("SC: e-Sfinge, arquivos para baixar")
          for url in ("https://www.tcesc.tc.br/esfinge", "https://www.tcesc.tc.br/esfinge-captura"):
              pag, final = pegar(url, "text/html")
              if not pag: continue
              print("  texto:", texto_da_pagina(pag, 2500))
              for u, x in mostrar_links(pag, final, r"download|arquivo|tabela|zip|csv|dados")[:6]:
                  if "tcesc" not in u: continue
                  if re.search(ARQUIVO, u, re.I): tamanho(u); continue
                  p2, f2 = pegar(u, "text/html")
                  if not p2: continue
                  print("  texto:", texto_da_pagina(p2, 2500))
                  arquivos = [a for a, _ in mostrar_links(p2, f2, ARQUIVO + r"|download|20\d\d", 80) if re.search(ARQUIVO, a, re.I)]
                  for a in arquivos[:5]: tamanho(a)

          titulo("PB: portal de dados abertos do TCE-PB (montado por script)")
          for base in ("https://dados-abertos.tce.pb.gov.br/", "https://dados.tce.pb.gov.br/"):
              pag, final = pegar(base, "text/html", tempo=60)
              if not pag: continue
              print("  texto:", texto_da_pagina(pag, 1500))
              arquivos = [a for a, _ in mostrar_links(pag, final, FILTRO) if re.search(ARQUIVO, a, re.I)]
              for a in arquivos[:5]: tamanho(a)
              scripts = [urljoin(final, s) for s in re.findall(r'<script[^>]+src\s*=\s*["\']([^"\']+)["\']', pag, re.I)]
              print("  scripts:", scripts[:20])
              enderecos = collections.Counter()
              for s in scripts[:12]:
                  js, _ = pegar(s, "*/*", tempo=90)
                  if not js: continue
                  for u in re.findall(r"https?://[A-Za-z0-9.\-]+(?:/[^\s\"'`<>)\\]*)?", js): enderecos[u] += 1
                  for u in re.findall(r"[\"'`](/(?:api|v\d|dados|sagres|municipal|empenho|despesa)[^\s\"'`<>\\]{0,120})[\"'`]", js): enderecos[u] += 1
              print(f"  {len(enderecos)} endereços nos scripts:")
              for u in sorted(enderecos)[:200]:
                  if not re.search(r"w3\.org|reactjs|react\.dev|github\.com/|mozilla|googleapis|gstatic|schema\.org|jquery|bootstrap|fontawesome", u):
                      print("   -", u)

          titulo("PB: documentação da API (docs-api.tce.pb.gov.br)")
          base = "https://docs-api.tce.pb.gov.br"
          pag, final = pegar(base + "/", "text/html", tempo=60)
          if pag:
              print("  texto:", texto_da_pagina(pag, 4000))
              mostrar_links(pag, final, FILTRO + r"|swagger|openapi|redoc")
          for c in ("/swagger.json", "/openapi.json", "/v3/api-docs", "/swagger/v1/swagger.json", "/api-docs"):
              corpo, _ = pegar(base + c, "application/json", tempo=60)
              d = como_json(corpo) if corpo else None
              if isinstance(d, dict) and "paths" in d:
                  print("  título:", (d.get("info") or {}).get("title"), "| servidores:", d.get("servers") or d.get("host"))
                  for caminho, metodos in list(d["paths"].items())[:200]:
                      resumo = next((v.get("summary") or v.get("description") or "" for v in metodos.values() if isinstance(v, dict)), "")
                      print(f"   {','.join(m.upper() for m in metodos if m in ('get', 'post'))} {caminho} :: {resumo[:100]}")
                  break

          titulo("BA: Tribunal de Contas dos Municípios (TCM-BA)")
          for url in ("https://www.tcm.ba.gov.br/", "https://e.tcm.ba.gov.br/"):
              pag, final = pegar(url, "text/html", tempo=60)
              if not pag: continue
              print("  texto:", texto_da_pagina(pag, 1500))
              achados = mostrar_links(pag, final, FILTRO + r"|cidadania|consulta|c[aâ]mara")
              seguir = [u for u, x in achados if re.search(r"dados.?abertos|despesa|cidadania|api", u + " " + x, re.I)
                        and "tcm.ba.gov.br" in u and not re.search(ARQUIVO + r"|\.pdf", u, re.I)]
              for u in seguir[:4]:
                  p2, f2 = pegar(u, "text/html", tempo=60)
                  if not p2: continue
                  print("  texto:", texto_da_pagina(p2, 2500))
                  arquivos = [a for a, _ in mostrar_links(p2, f2, FILTRO, 80) if re.search(ARQUIVO, a, re.I)]
                  for a in arquivos[:5]: tamanho(a)

          print(f"\npedidos feitos: {pedidos[0]}")
          PY

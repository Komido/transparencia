name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python3 -m pip install --quiet openpyxl==3.1.5

      # Tesouro Transparente: série "Emendas Parlamentares Individuais e de
      # bancada" (uma linha por ordem bancária, com o código IBGE do ente)
      # contra o Portal (pagamentos por favorecido), por ano: o Tesouro cobre
      # o que o Portal registrou como pago ao Banco do Brasil? Só totais.
      - name: Tesouro contra Portal, emendas individuais e de bancada por ano
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/te && cd /tmp/te
          AGENTE="ArrecadometroBrasil/1.0 (dados publicos; github.com/Komido/transparencia)"
          curl -sSL --max-time 900 -A "$AGENTE" -o tesouro.csv -w "Tesouro: HTTP %{http_code} %{size_download} bytes\n" \
            "https://www.tesourotransparente.gov.br/ckan/dataset/83e419da-1552-46bf-bfc3-05160b2c46c9/resource/66d69917-a5d8-4500-b4b2-ef1f5d062430/download/emendas-parlamentares.csv"
          curl -sSL --max-time 900 -A "$AGENTE" -o em.zip -w "Portal: HTTP %{http_code} %{size_download} bytes\n" \
            "https://dadosabertos-download.cgu.gov.br/PortalDaTransparencia/saida/emendas-parlamentares/EmendasParlamentares.zip"
          python3 - tesouro.csv em.zip <<'PY'
          import collections, csv, io, sys, unicodedata, zipfile
          def num(t):
              t = (t or "").strip()
              if "," in t: t = t.replace(".", "").replace(",", ".")
              try: return float(t)
              except ValueError: return 0.0
          def sem(t): return "".join(c for c in unicodedata.normalize("NFD", t or "") if not unicodedata.combining(c)).upper().strip()
          bruto = open(sys.argv[1], "rb").read()
          try: texto = bruto.decode("utf-8-sig")
          except UnicodeDecodeError: texto = bruto.decode("latin-1")
          te = collections.Counter(); te_cid = collections.Counter(); te_valores = []
          for l in csv.DictReader(io.StringIO(texto), delimiter=";"):
              a = int(l["Ano"]); v = num(l["Valor"])
              if a < 2023: continue
              te[(a, l["Tipo Ente"], l["Nome Emenda"], l["Transferência Especial"])] += v
              if l["Código IBGE"] in ("3101607", "3550308", "3125200"):
                  te_cid[(a, l["Código IBGE"], l["Nome Emenda"], l["Transferência Especial"])] += v
              if len(te_valores) < 5: te_valores.append(l["Valor"])
          print("exemplos de valor no Tesouro:", te_valores)
          print("\n## Tesouro, por ano, tipo de ente, tipo de emenda, transferência especial (R$ bi)")
          for k in sorted(te): print(" ", k, round(te[k] / 1e9, 3))
          z = zipfile.ZipFile(sys.argv[2])
          fav = [n for n in z.namelist() if "PorFavorecido" in n][0]
          po = collections.Counter(); po_cid = collections.Counter()
          alvo = {("MG", "ALFENAS"): "3101607", ("SP", "SAO PAULO"): "3550308", ("MG", "FAMA"): "3125200"}
          for l in csv.DictReader(io.TextIOWrapper(z.open(fav), encoding="latin-1", newline=""), delimiter=";"):
              am = (l["Ano/Mês"] or "").strip()
              if len(am) < 4 or int(am[:4]) < 2023: continue
              a = int(am[:4]); v = num(l["Valor Recebido"]); tipo = l["Tipo de Emenda"].strip()
              if not (tipo.startswith("Emenda Individual") or tipo == "Emenda de Bancada"): continue
              grupo = "Bancada" if tipo == "Emenda de Bancada" else ("Individual especial" if "Especiais" in tipo else "Individual finalidade")
              cnpj = "".join(c for c in l["Código do Favorecido"] if c.isdigit())
              nat = l.get("Natureza Jurídica") or ""
              if cnpj == "00000000000191": dest = "Banco do Brasil"
              elif nat in ("Município", "Fundo Público da Administração Direta Municipal"): dest = "prefeitura e fundos"
              elif "Estad" in nat or "Distrito Federal" in nat: dest = "estado"
              else: dest = "outros"
              po[(a, grupo, dest)] += v
              cod = alvo.get((l["UF Favorecido"].strip(), sem(l["Município Favorecido"])))
              if cod and dest == "prefeitura e fundos": po_cid[(a, cod, grupo)] += v
          print("\n## Portal, emendas individuais e de bancada, por ano, grupo e destino (R$ bi)")
          for k in sorted(po): print(" ", k, round(po[k] / 1e9, 3))
          print("\n## Cidades: Tesouro (por tipo e transferência especial) e Portal (prefeitura e fundos), R$ milhões")
          for k in sorted(te_cid): print("  Tesouro", k, round(te_cid[k] / 1e6, 2))
          for k in sorted(po_cid): print("  Portal ", k, round(po_cid[k] / 1e6, 2))
          PY

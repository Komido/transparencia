name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Câmaras de Pernambuco e do Ceará: em que cada Câmara gastou, pelas
      # APIs de dados abertos dos Tribunais de Contas (TCE-PE e TCE-CE). Lista
      # todas as entidades e métodos, a ligação entre unidade gestora, Câmara e
      # município, e consulta uma Câmara pequena e uma grande para ver tamanho,
      # campos, valor pago e se há limite de linhas. Só leitura, respeitando o
      # robots.txt e o Crawl-Delay.
      - name: Arquivo anual do TCE-PR (despesas das câmaras)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import collections, json, re, time, urllib.error, urllib.parse, urllib.request, urllib.robotparser

          AGENTE = "ArrecadometroBrasil/1.0 (dados publicos)"
          robots, atraso, pedidos = {}, {}, [0]

          def baixar(url, aceitar="*/*", limite=60_000_000, metodo="GET", tempo=180):
              time.sleep(atraso.get(urllib.parse.urlsplit(url).netloc, 2))
              pedidos[0] += 1
              cab = {"User-Agent": AGENTE, "Accept": aceitar}
              pedido = urllib.request.Request(url, headers=cab, method=metodo)
              inicio = time.time()
              try:
                  with urllib.request.urlopen(pedido, timeout=tempo) as r:
                      corpo = r.read(limite) if metodo == "GET" else b""
                      return r.status, dict(r.headers), r.geturl(), corpo, time.time() - inicio
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers or {}), url, e.read(3000), time.time() - inicio
              except Exception as e:
                  return 0, {}, url, repr(e).encode(), time.time() - inicio

          def permitido(url):
              p = urllib.parse.urlsplit(url); base = f"{p.scheme}://{p.netloc}"
              if base not in robots:
                  st, _, _, corpo, _ = baixar(base + "/robots.txt", "text/plain", 200_000)
                  linhas = corpo.decode("utf-8", "replace").splitlines() if st == 200 and b"<html" not in corpo[:500].lower() else []
                  print(f"\nrobots.txt de {p.netloc}: HTTP {st}" + "".join("\n    " + l for l in linhas[:25]))
                  rp = urllib.robotparser.RobotFileParser(); rp.parse(linhas)
                  atraso[p.netloc] = max(2, float(rp.crawl_delay(AGENTE) or 0))
                  grupo, proibe = None, False
                  for l in linhas:
                      k, _, v = l.split("#")[0].partition(":")
                      k, v = k.strip().lower(), v.strip()
                      if k == "user-agent": grupo = v
                      elif k == "disallow" and grupo == "*" and v == "/": proibe = True
                  robots[base] = "proibido" if proibe else rp
                  if proibe: print("    (um bloco para todos os robôs proíbe o site inteiro: nada será lido)")
              rp = robots[base]
              return rp != "proibido" and rp.can_fetch(AGENTE, url)

          def pegar(url, aceitar="*/*", mostrar=True, tempo=180):
              if not permitido(url):
                  print(f"\n### {url}\n  robots.txt não permite; pulado"); return None, None
              st, cab, final, corpo, seg = baixar(url, aceitar, tempo=tempo)
              if mostrar:
                  print(f"\n### {url}\n  HTTP {st} | {cab.get('Content-Type', '')} | {len(corpo)} bytes | {seg:.1f} s" + (f" | foi para {final}" if final != url else ""))
              if st != 200:
                  print("  ", corpo[:400]); return None, None
              tipo = cab.get("Content-Type", "").lower()
              m = re.search(r"charset=([\w-]+)", tipo)
              enc = m.group(1) if m else ("utf-8" if b"\xc3" in corpo[:200000] else "latin-1")
              return corpo.decode(enc, "replace"), final

          def texto_da_pagina(html, limite=8000):
              t = re.sub(r"<script.*?</script>|<style.*?</style>", " ", html, flags=re.S | re.I)
              t = re.sub(r"<[^>]+>", " | ", t)
              t = re.sub(r"(\s*\|\s*)+", " | ", re.sub(r"[ \t\r\n]+", " ", t))
              return t[:limite]

          def como_json(texto):
              try: return json.loads(texto)
              except Exception: return None

          def registros(dado):
              """Acha a lista de registros dentro da resposta, qualquer que seja o envelope."""
              if isinstance(dado, list): return dado, "lista na raiz"
              if isinstance(dado, dict):
                  for k, v in dado.items():
                      if isinstance(v, list) and v and isinstance(v[0], dict): return v, k
                  for k, v in dado.items():
                      if isinstance(v, dict):
                          r, c = registros(v)
                          if r: return r, f"{k}.{c}"
              return [], None

          def mostrar_registros(texto, campos_soma=(), contar=()):
              dado = como_json(texto)
              if dado is None:
                  print("  não é JSON; começo:", texto[:600]); return []
              if isinstance(dado, dict):
                  print("  chaves de topo:", {k: (type(v).__name__, (len(v) if hasattr(v, '__len__') else v)) for k, v in list(dado.items())[:12]})
              regs, onde = registros(dado)
              if not regs:
                  print("  sem lista de registros; começo:", texto[:800]); return []
              print(f"  {len(regs)} registros (em {onde}); campos: {list(regs[0].keys())}")
              for r in regs[:2]: print("   exemplo:", json.dumps(r, ensure_ascii=False)[:900])
              for c in campos_soma:
                  try: print(f"  soma de {c}: {sum(float(str(r.get(c) or 0).replace(',', '.')) for r in regs):,.2f}")
                  except Exception as e: print(f"  soma de {c}: {e}")
              for c in contar:
                  print(f"  valores de {c}:", collections.Counter(str(r.get(c)) for r in regs).most_common(25))
              return regs

          def titulo(t): print("\n" + "=" * 72 + "\n" + t + "\n" + "=" * 72)

          def num(v):
              try: return float(str(v or 0).replace(",", "."))
              except ValueError: return 0.0

          def somar_por(regs, chave, valor):
              c = collections.defaultdict(float)
              for r in regs: c[chave(r)] += num(r.get(valor))
              return sorted(c.items(), key=lambda x: -x[1])

          # ------------------------------------------------------------------
          # 19/11, segunda rodada do Paraná: o zip anual traz um zip por cidade
          # e tema (2025_410010_Despesa.zip etc.), com XML (Empenho,
          # EmpenhoPagamento, EmpenhoPagamentoEstorno...). Numa amostra de
          # cidades: todos os campos de um empenho e de um pagamento da Câmara,
          # os órgãos de cada cidade, e o total empenhado e pago pela Câmara,
          # com o tempo de leitura para estimar o custo do estado inteiro.
          import io, os, zipfile
          import xml.etree.ElementTree as ET
          titulo("TCE-PR: arquivo anual, amostra de câmaras")
          base = "https://pit.tce.pr.gov.br/Arquivos/{}_PIT_TodosArquivos.zip"
          if not permitido(base.format(2025)):
              raise SystemExit("o robots.txt do PIT não permite baixar os arquivos")
          for ano in (2025, 2024):
              st, cab, _, _, seg = baixar(base.format(ano), metodo="HEAD", tempo=120)
              print(f"  {ano}: HEAD HTTP {st} | {int(cab.get('Content-Length') or 0) / 1e6:.0f} MB | {cab.get('Last-Modified')} | partes: {cab.get('Accept-Ranges')}")
          destino = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "pr-2025.zip")
          inicio = time.time()
          with urllib.request.urlopen(urllib.request.Request(base.format(2025), headers={"User-Agent": AGENTE}), timeout=600) as r, open(destino, "wb") as fh:
              while bloco := r.read(1 << 20):
                  fh.write(bloco)
          print(f"  2025 baixado: {os.path.getsize(destino) / 1e6:.0f} MB em {(time.time() - inicio) / 60:.1f} min", flush=True)
          z = zipfile.ZipFile(destino)
          temas = collections.Counter(re.sub(r"^\d+_\d+_", "", i.filename) for i in z.infolist())
          print(f"  {len(z.infolist())} arquivos; temas: {dict(temas)}")
          despesas = {re.match(r"\d+_(\d+)_", i.filename).group(1): i for i in z.infolist() if i.filename.endswith("_Despesa.zip")}
          print(f"  cidades com Despesa: {len(despesas)}; tamanho total compactado {sum(i.compress_size for i in despesas.values()) / 1e6:.0f} MB")
          amostra = [c for c in ("410690", "411370", "411520", "410010") if c in despesas] + sorted(despesas)[::45]
          ja = set()
          def registros_xml(dados, marca):
              for _, el in ET.iterparse(io.BytesIO(dados)):
                  if el.tag == marca:
                      yield dict(el.attrib)
                  el.clear()
          eh_camara = lambda nome: bool(re.search(r"C[AÂ]MARA|LEGISLATIV", nome or "", re.I)) and not re.search(r"PREFEITURA|FUNDO", nome or "", re.I)
          for cod in amostra:
              t0 = time.time()
              interno = zipfile.ZipFile(io.BytesIO(z.read(despesas[cod])))
              nomes = {re.sub(r"^\d+_\d+_", "", n): n for n in interno.namelist()}
              emp = interno.read(nomes["Empenho.xml"])
              entidades = collections.Counter()
              cam_ids, cam_emp, ano_emp = set(), 0.0, collections.Counter()
              for r in registros_xml(emp, "Empenho"):
                  entidades[(r.get("idPessoa"), r.get("nmEntidade"))] += 1
                  if eh_camara(r.get("nmEntidade")):
                      cam_ids.add(r.get("idEmpenho"))
                      cam_emp += num(r.get("vlEmpenho"))
                      ano_emp[r.get("nrAnoEmpenho")] += 1
                      if "emp" not in ja:
                          ja.add("emp"); print("\n  EMPENHO DA CÂMARA, todos os campos:\n   ", json.dumps(r, ensure_ascii=False))
              pago, por_ano, n_pag = 0.0, collections.Counter(), 0
              for r in registros_xml(interno.read(nomes["EmpenhoPagamento.xml"]), "EmpenhoPagamento"):
                  if r.get("idEmpenho") in cam_ids:
                      n_pag += 1
                      v = num(r.get("vlOperacao"))
                      pago += v
                      por_ano[(r.get("nrAnoPagamento"), (r.get("dtOperacao") or "")[:4])] += v
                      if "pag" not in ja:
                          ja.add("pag"); print("\n  PAGAMENTO DA CÂMARA, todos os campos:\n   ", json.dumps(r, ensure_ascii=False))
              estorno = 0.0
              if "EmpenhoPagamentoEstorno.xml" in nomes:
                  for r in registros_xml(interno.read(nomes["EmpenhoPagamentoEstorno.xml"]), "EmpenhoPagamentoEstorno"):
                      if "est" not in ja:
                          ja.add("est"); print("\n  ESTORNO DE PAGAMENTO, todos os campos:\n   ", json.dumps(r, ensure_ascii=False))
                      if r.get("idEmpenho") in cam_ids:
                          estorno += num(r.get("vlOperacao") or r.get("vlEstorno"))
              camaras = [e for e in entidades if eh_camara(e[1])]
              print(f"\n  {cod}: {len(emp) / 1e6:.0f} MB de empenhos; órgãos {len(entidades)}; câmaras {camaras}; "
                    f"empenhos da câmara {len(cam_ids)} (anos {dict(ano_emp)}); empenhado {cam_emp:,.2f}; "
                    f"pago {pago:,.2f} em {n_pag} pagamentos; estornado {estorno:,.2f}; por ano {dict((k, round(v)) for k, v in por_ano.items())}; "
                    f"{time.time() - t0:.1f} s", flush=True)
              if cod in ("410010",):
                  print("   órgãos:", [e[1] for e in entidades])
              if time.time() - inicio > 20 * 60:
                  print("  parando a amostra pelo tempo"); break
          rel = [i for i in z.infolist() if i.filename.endswith("410010_Relacionamentos.zip")]
          if rel:
              interno = zipfile.ZipFile(io.BytesIO(z.read(rel[0])))
              for n in interno.namelist():
                  dados = interno.read(n)
                  print(f"\n  {n}: {len(dados) / 1e6:.1f} MB; começo:", dados[:700].decode("utf-8", "replace"))

          print(f"\npedidos feitos: {pedidos[0]}")
          PY

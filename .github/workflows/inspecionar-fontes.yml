name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Câmaras de Pernambuco e do Ceará: em que cada Câmara gastou, pelas
      # APIs de dados abertos dos Tribunais de Contas (TCE-PE e TCE-CE). Lista
      # todas as entidades e métodos, a ligação entre unidade gestora, Câmara e
      # município, e consulta uma Câmara pequena e uma grande para ver tamanho,
      # campos, valor pago e se há limite de linhas. Só leitura, respeitando o
      # robots.txt e o Crawl-Delay.
      - name: Câmaras de PE e CE nas APIs dos Tribunais de Contas
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import collections, json, re, time, urllib.error, urllib.parse, urllib.request, urllib.robotparser

          AGENTE = "ArrecadometroBrasil/1.0 (dados publicos)"
          robots, atraso, pedidos = {}, {}, [0]

          def baixar(url, aceitar="*/*", limite=60_000_000, metodo="GET", tempo=180):
              time.sleep(atraso.get(urllib.parse.urlsplit(url).netloc, 2))
              pedidos[0] += 1
              cab = {"User-Agent": AGENTE, "Accept": aceitar}
              pedido = urllib.request.Request(url, headers=cab, method=metodo)
              inicio = time.time()
              try:
                  with urllib.request.urlopen(pedido, timeout=tempo) as r:
                      corpo = r.read(limite) if metodo == "GET" else b""
                      return r.status, dict(r.headers), r.geturl(), corpo, time.time() - inicio
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers or {}), url, e.read(3000), time.time() - inicio
              except Exception as e:
                  return 0, {}, url, repr(e).encode(), time.time() - inicio

          def permitido(url):
              p = urllib.parse.urlsplit(url); base = f"{p.scheme}://{p.netloc}"
              if base not in robots:
                  st, _, _, corpo, _ = baixar(base + "/robots.txt", "text/plain", 200_000)
                  linhas = corpo.decode("utf-8", "replace").splitlines() if st == 200 and b"<html" not in corpo[:500].lower() else []
                  print(f"\nrobots.txt de {p.netloc}: HTTP {st}" + "".join("\n    " + l for l in linhas[:25]))
                  rp = urllib.robotparser.RobotFileParser(); rp.parse(linhas)
                  atraso[p.netloc] = max(2, float(rp.crawl_delay(AGENTE) or 0))
                  grupo, proibe = None, False
                  for l in linhas:
                      k, _, v = l.split("#")[0].partition(":")
                      k, v = k.strip().lower(), v.strip()
                      if k == "user-agent": grupo = v
                      elif k == "disallow" and grupo == "*" and v == "/": proibe = True
                  robots[base] = "proibido" if proibe else rp
                  if proibe: print("    (um bloco para todos os robôs proíbe o site inteiro: nada será lido)")
              rp = robots[base]
              return rp != "proibido" and rp.can_fetch(AGENTE, url)

          def pegar(url, aceitar="*/*", mostrar=True, tempo=180):
              if not permitido(url):
                  print(f"\n### {url}\n  robots.txt não permite; pulado"); return None, None
              st, cab, final, corpo, seg = baixar(url, aceitar, tempo=tempo)
              if mostrar:
                  print(f"\n### {url}\n  HTTP {st} | {cab.get('Content-Type', '')} | {len(corpo)} bytes | {seg:.1f} s" + (f" | foi para {final}" if final != url else ""))
              if st != 200:
                  print("  ", corpo[:400]); return None, None
              tipo = cab.get("Content-Type", "").lower()
              m = re.search(r"charset=([\w-]+)", tipo)
              enc = m.group(1) if m else ("utf-8" if b"\xc3" in corpo[:200000] else "latin-1")
              return corpo.decode(enc, "replace"), final

          def texto_da_pagina(html, limite=8000):
              t = re.sub(r"<script.*?</script>|<style.*?</style>", " ", html, flags=re.S | re.I)
              t = re.sub(r"<[^>]+>", " | ", t)
              t = re.sub(r"(\s*\|\s*)+", " | ", re.sub(r"[ \t\r\n]+", " ", t))
              return t[:limite]

          def como_json(texto):
              try: return json.loads(texto)
              except Exception: return None

          def registros(dado):
              """Acha a lista de registros dentro da resposta, qualquer que seja o envelope."""
              if isinstance(dado, list): return dado, "lista na raiz"
              if isinstance(dado, dict):
                  for k, v in dado.items():
                      if isinstance(v, list) and v and isinstance(v[0], dict): return v, k
                  for k, v in dado.items():
                      if isinstance(v, dict):
                          r, c = registros(v)
                          if r: return r, f"{k}.{c}"
              return [], None

          def mostrar_registros(texto, campos_soma=(), contar=()):
              dado = como_json(texto)
              if dado is None:
                  print("  não é JSON; começo:", texto[:600]); return []
              if isinstance(dado, dict):
                  print("  chaves de topo:", {k: (type(v).__name__, (len(v) if hasattr(v, '__len__') else v)) for k, v in list(dado.items())[:12]})
              regs, onde = registros(dado)
              if not regs:
                  print("  sem lista de registros; começo:", texto[:800]); return []
              print(f"  {len(regs)} registros (em {onde}); campos: {list(regs[0].keys())}")
              for r in regs[:2]: print("   exemplo:", json.dumps(r, ensure_ascii=False)[:900])
              for c in campos_soma:
                  try: print(f"  soma de {c}: {sum(float(str(r.get(c) or 0).replace(',', '.')) for r in regs):,.2f}")
                  except Exception as e: print(f"  soma de {c}: {e}")
              for c in contar:
                  print(f"  valores de {c}:", collections.Counter(str(r.get(c)) for r in regs).most_common(25))
              return regs

          def titulo(t): print("\n" + "=" * 72 + "\n" + t + "\n" + "=" * 72)

          def num(v):
              try: return float(str(v or 0).replace(",", "."))
              except ValueError: return 0.0

          def somar_por(regs, chave, valor):
              c = collections.defaultdict(float)
              for r in regs: c[chave(r)] += num(r.get(valor))
              return sorted(c.items(), key=lambda x: -x[1])

          # ------------------------------------------------------------------
          # Segunda rodada (18/11): a primeira mostrou que o TCE-PE tem a lista
          # de unidades com a natureza "Câmara Municipal" e que o TCE-CE tem o
          # balancete mensal da despesa por órgão e elemento. Agora: quantas
          # câmaras, como ligar ao IBGE, subelemento do salário dos vereadores,
          # consulta do estado inteiro pela função Legislativa (PE), e se o
          # pago do balancete bate com as notas de pagamento e com o Tesouro (CE).
          titulo("TCE-PE: câmaras na lista de unidades e ligação com o IBGE")
          PE = "https://sistemas.tce.pe.gov.br/DadosAbertos/"
          html, _ = pegar(PE + "UnidadesJurisdicionadas!json")
          ujs = registros(como_json(html))[0] if html else []
          print("  naturezas:", collections.Counter(r.get("NATUREZA") for r in ujs if (r.get("ESFERA") or "").strip() == "Municipal").most_common(30))
          camaras = [r for r in ujs if (r.get("NATUREZA") or "").startswith("Câmara")]
          print(f"  câmaras: {len(camaras)}; situações: {collections.Counter(r.get('SITUACAO') for r in camaras)}; poder: {collections.Counter(r.get('PODER') for r in camaras)}")
          por_muni = collections.Counter(r.get("CODIGOMUNICIPIO") for r in camaras if r.get("SITUACAO") == "Ativa")
          print("  municípios com mais de uma câmara ativa:", [(k, v) for k, v in por_muni.items() if v > 1])
          for r in camaras[:3]: print("   ", json.dumps(r, ensure_ascii=False))
          html, _ = pegar(PE + "Municipios!json?UNIDADEFEDERATIVA=PE")
          mun = registros(como_json(html))[0] if html else []
          print(f"  municípios de PE: {len(mun)}; exemplos: {mun[:3]}")
          ibge = {r.get("CODIGO"): r.get("CODIGOIBGE") for r in mun}
          sem = [r.get("MUNICIPIO") for r in camaras if r.get("SITUACAO") == "Ativa" and r.get("CODIGOMUNICIPIO") not in ibge]
          print(f"  câmaras ativas sem código IBGE pela tabela de municípios: {len(sem)} {sem[:10]}")
          sem_camara = [r.get("MUNICIPIO") for r in mun if r.get("CODIGO") not in por_muni]
          print(f"  municípios de PE sem câmara ativa na lista: {len(sem_camara)} {sem_camara[:10]}")

          titulo("TCE-PE: despesas de uma câmara grande e de uma pequena (2025)")
          recife = [r for r in camaras if r.get("MUNICIPIO") == "Recife" and r.get("SITUACAO") == "Ativa"]
          pequena = [r for r in camaras if r.get("MUNICIPIO") == "Abreu e Lima" and r.get("SITUACAO") == "Ativa"]
          for r in (recife[:1] + pequena[:1]):
              ug = r.get("ID_UNIDADE_GESTORA")
              print(f"\n  >>> {r.get('ORGAO')} (unidade {ug}, município {r.get('CODIGOMUNICIPIO')})")
              html, _ = pegar(PE + f"DespesasMunicipais!json?ID_UNIDADE_GESTORA={ug}&ANOREFERENCIA=2025", "application/json", tempo=300)
              regs = registros(como_json(html))[0] if html else []
              if not regs: continue
              print(f"  {len(regs)} empenhos; empenhado {sum(num(x.get('VALOREMPENHADO')) for x in regs):,.2f}; liquidado {sum(num(x.get('VALORLIQUIDADO')) for x in regs):,.2f}; pago {sum(num(x.get('VALORPAGO')) for x in regs):,.2f}")
              print("  pago por modalidade:", somar_por(regs, lambda x: x.get("MODALIDADE"), "VALORPAGO"))
              print("  pago por função:", somar_por(regs, lambda x: x.get("FUNCAO"), "VALORPAGO"))
              print("  pago por grupo (NATUREZA):", somar_por(regs, lambda x: x.get("NATUREZA"), "VALORPAGO"))
              print("  pago por elemento e subelemento:")
              for k, v in somar_por(regs, lambda x: (x.get("ELEMENTODESPESA"), x.get("SUBELEMENTODESPESA")), "VALORPAGO")[:40]:
                  print(f"    {v:16,.2f}  {k}")
              print("  pago por mês do empenho:", sorted(somar_por(regs, lambda x: int(x.get("MESREFERENCIA") or 0), "VALORPAGO")))
              html, _ = pegar(PE + f"TransferenciasConcedidasMunicipais!json?ID_UG_BENEFICIADA={ug}&ANO_REFERENCIA=2025", "application/json")
              tr = registros(como_json(html))[0] if html else []
              if tr:
                  print(f"  repasses recebidos em 2025: {len(tr)}; soma {sum(num(x.get('VALOR_MENSAL_CONCEDIDO')) for x in tr):,.2f}; tipos {collections.Counter(x.get('DESCRICAO_TIPO_TRANSFERENCIA') for x in tr)}; de {collections.Counter(x.get('NOME_UG_TRANSFERIDORA') for x in tr)}")
          if pequena:
              html, _ = pegar(PE + f"DespesasMunicipais!json?ID_UNIDADE_GESTORA={pequena[0].get('ID_UNIDADE_GESTORA')}&ANOREFERENCIA=2024", "application/json", tempo=300)
              regs = registros(como_json(html))[0] if html else []
              print(f"  2024, câmara pequena: {len(regs)} empenhos; pago {sum(num(x.get('VALORPAGO')) for x in regs):,.2f}")

          titulo("TCE-PE: estado inteiro pela função Legislativa, um mês (2025, março)")
          html, _ = pegar(PE + "DespesasMunicipais!json?FUNCAO=Legislativa&ANOREFERENCIA=2025&MESREFERENCIA=3", "application/json", tempo=300)
          if html:
              d = como_json(html)
              print("  cabeçalho:", {k: v for k, v in (d or {}).get("resposta", {}).items() if k != "conteudo"})
              regs = registros(d)[0] or []
              ugs = collections.Counter(r.get("ID_UNIDADE_GESTORA") for r in regs)
              nat = {r.get("ID_UNIDADE_GESTORA"): r.get("NATUREZA") for r in ujs}
              print(f"  {len(regs)} empenhos de {len(ugs)} unidades; natureza das unidades: {collections.Counter(nat.get(u) for u in ugs)}")
              print(f"  pago: {sum(num(r.get('VALORPAGO')) for r in regs):,.2f}")

          # ------------------------------------------------------------------
          titulo("TCE-CE: API nova, especificação")
          CEN = "https://api-dados-abertos.tce.ce.gov.br/sim/"
          html, _ = pegar(CEN + "swagger-initializer.js")
          if html:
              print("  ", html[:1500])
              for u in re.findall(r'url\s*:\s*["\']([^"\']+)["\']', html):
                  spec, _ = pegar(urllib.parse.urljoin(CEN, u), "application/json", tempo=240)
                  d = como_json(spec) if spec else None
                  if isinstance(d, dict):
                      print("  servidores:", d.get("servers") or d.get("host"), d.get("basePath"))
                      caminhos = d.get("paths") or {}
                      print(f"  {len(caminhos)} caminhos:")
                      for c, ops in caminhos.items():
                          params = [x.get("name") for op in ops.values() if isinstance(op, dict) for x in op.get("parameters", []) if isinstance(x, dict)]
                          print(f"    {c} {params[:20]}")
                  elif spec:
                      print("  começo:", spec[:800])

          titulo("TCE-CE: balancete da câmara contra notas de pagamento e Tesouro")
          CE = "https://api.tce.ce.gov.br/index.php/sim/1_0/"
          html, _ = pegar(CE + "tipos_unidades_administrativas.json", "application/json")
          if html: mostrar_registros(html)
          for cod, nome in (("057", "Fortaleza"), ("003", "Acarape")):
              for ano, ref in ((2025, "202512"), (2024, "202412")):
                  html, _ = pegar(CE + f"balancete_despesa_orcamentaria.json?codigo_municipio={cod}&exercicio_orcamento={ano}00&codigo_orgao=01&data_referencia={ref}", "application/json")
                  regs = registros(como_json(html))[0] if html else []
                  if not regs: continue
                  campos = ("valor_empenhado_ate_mes", "valor_anulacoes_empenhos_ate_mes", "valor_liquidado_ate_mes", "valor_estornos_liquidacao_ate_mes", "valor_pago_ate_mes", "valor_estornos_pagos_ate_mes")
                  print(f"  {nome} {ano}: {len(regs)} linhas; tipos de balancete {collections.Counter(r.get('tipo_balancete') for r in regs)}")
                  for c in campos: print(f"    {c}: {sum(num(r.get(c)) for r in regs):,.2f}")
                  print("    pago por elemento:", [(k, round(v)) for k, v in somar_por(regs, lambda x: x.get("codigo_elemento_despesa"), "valor_pago_ate_mes")])
                  intra = sum(num(r.get("valor_pago_ate_mes")) for r in regs if str(r.get("codigo_elemento_despesa", ""))[2:4] == "91")
                  print(f"    pago intra-orçamentário (modalidade 91): {intra:,.2f}")
                  if ano == 2025:
                      html, _ = pegar(CE + f"notas_pagamentos.json?codigo_municipio={cod}&exercicio_orcamento=202500&codigo_orgao=01", "application/json")
                      np_ = registros(como_json(html))[0] if html else []
                      ok = [r for r in np_ if str(r.get("estado_de_estornado")) != "1"]
                      no_ano = [r for r in ok if str(r.get("data_referencia", "")).startswith("2025")]
                      print(f"    notas de pagamento não estornadas: {sum(num(r.get('valor_nota_pagamento')) for r in ok):,.2f}; só as de 2025: {sum(num(r.get('valor_nota_pagamento')) for r in no_ano):,.2f}")
          # Último mês disponível de 2026 e balancete sem filtro de órgão.
          for ref in ("202610", "202609", "202608"):
              html, _ = pegar(CE + f"balancete_despesa_orcamentaria.json?codigo_municipio=003&exercicio_orcamento=202600&codigo_orgao=01&data_referencia={ref}", "application/json")
              if html:
                  regs = registros(como_json(html))[0] or []
                  print(f"  Acarape 2026 até {ref}: {len(regs)} linhas; pago {sum(num(r.get('valor_pago_ate_mes')) for r in regs):,.2f}")
                  break
          html, _ = pegar(CE + "balancete_despesa_orcamentaria.json?codigo_municipio=003&exercicio_orcamento=202500&data_referencia=202512", "application/json")
          if html:
              regs = registros(como_json(html))[0] or []
              print(f"  Acarape 2025 sem filtro de órgão: {len(regs)} linhas; órgãos {collections.Counter(r.get('codigo_orgao') for r in regs)}")

          titulo("TCE-CE: código da câmara em uma amostra de municípios")
          html, _ = pegar(CE + "municipios.json", "application/json")
          muni = registros(como_json(html))[0] if html else []
          amostra = muni[::18][:11]
          for r in amostra:
              html, _ = pegar(CE + f"orgaos.json?codigo_municipio={r.get('codigo_municipio')}&exercicio_orcamento=202500", "application/json", mostrar=False)
              org = registros(como_json(html))[0] if html else []
              cam = [(o.get("codigo_orgao"), o.get("codigo_tipo_unidade"), o.get("nome_orgao")) for o in (org or []) if o.get("codigo_tipo_unidade") == "02" or re.search(r"C[AÂ]MARA|LEGISLAT", str(o.get("nome_orgao", "")), re.I)]
              print(f"  {r.get('nome_municipio')} ({r.get('geoibgeId')}): {len(org or [])} órgãos; câmara: {cam}")

          print(f"\npedidos feitos: {pedidos[0]}")
          PY

name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF, Excel, APIs com chave) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Mínimos constitucionais das prefeituras: 25% dos impostos em educação,
      # 70% do FUNDEB em salários e 15% em saúde, pelo Anexo 14 do RREO no
      # Tesouro (SICONFI). Confere em uma amostra variada se o anexo vem nos
      # dois tipos de relatório e se a base de cálculo implícita bate com o
      # Anexo 3. Só leitura, respeitando o robots.txt e o Crawl-Delay.
      - name: Anexo 14 do RREO, educação, FUNDEB e saúde das prefeituras
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import io, json, re, time, urllib.error, urllib.parse, urllib.request, urllib.robotparser, zipfile

          AGENTE = "ArrecadometroBrasil/1.0 (dados publicos)"
          robots, atraso = {}, {}

          def baixar(url, aceitar="*/*", limite=5_000_000, faixa=None, metodo="GET"):
              time.sleep(atraso.get(urllib.parse.urlsplit(url).netloc, 2))
              cab = {"User-Agent": AGENTE, "Accept": aceitar}
              if faixa: cab["Range"] = f"bytes=0-{faixa - 1}"
              pedido = urllib.request.Request(url, headers=cab, method=metodo)
              try:
                  with urllib.request.urlopen(pedido, timeout=90) as r:
                      return r.status, dict(r.headers), r.geturl(), (r.read(limite) if metodo == "GET" else b"")
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers or {}), url, e.read(3000)
              except Exception as e:
                  return 0, {}, url, repr(e).encode()

          def permitido(url):
              p = urllib.parse.urlsplit(url); base = f"{p.scheme}://{p.netloc}"
              if base not in robots:
                  st, _, _, corpo = baixar(base + "/robots.txt", "text/plain", 200_000)
                  linhas = corpo.decode("utf-8", "replace").splitlines() if st == 200 else []
                  print(f"\nrobots.txt de {p.netloc}: HTTP {st}" + "".join("\n    " + l for l in linhas[:25]))
                  rp = urllib.robotparser.RobotFileParser(); rp.parse(linhas)
                  atraso[p.netloc] = max(2, float(rp.crawl_delay(AGENTE) or 0))
                  grupo, proibe = None, False
                  for l in linhas:
                      k, _, v = l.split("#")[0].partition(":")
                      k, v = k.strip().lower(), v.strip()
                      if k == "user-agent": grupo = v
                      elif k == "disallow" and grupo == "*" and v == "/": proibe = True
                  robots[base] = "proibido" if proibe else rp
                  if proibe: print("    (um bloco para todos os robôs proíbe o site inteiro: nada será lido)")
              rp = robots[base]
              return rp != "proibido" and rp.can_fetch(AGENTE, url)

          def pegar_json(url):
              if not permitido(url):
                  print(f"\n### {url}\n  robots.txt não permite; pulado"); return None
              st, cab, final, corpo = baixar(url, "application/json")
              print(f"\n### {url}\n  HTTP {st} | {cab.get('Content-Type', '')} | {len(corpo)} bytes" + (f" | foi para {final}" if final != url else ""))
              if st != 200: print("  ", corpo[:300]); return None
              try: return json.loads(corpo.decode("utf-8-sig", "replace"))
              except Exception: print("  não é JSON:", corpo[:300]); return None

          def espiar(url):
              """Tamanho, data e o começo do arquivo (colunas), sem baixar tudo."""
              if not permitido(url):
                  print(f"    {url}: robots.txt não permite"); return
              st, cab, final, _ = baixar(url, metodo="HEAD")
              print(f"    HEAD {url}: HTTP {st} | {cab.get('Content-Type', '')} | {cab.get('Content-Length', '?')} bytes | {cab.get('Last-Modified', '')}")
              st, cab, final, corpo = baixar(url, faixa=8000, limite=8000)
              if st not in (200, 206): print(f"    começo: HTTP {st}"); return
              if corpo[:2] == b"PK":
                  print("    é zip; o começo não mostra as colunas"); return
              texto = corpo.decode("utf-8", "replace") if b"\xc3" in corpo else corpo.decode("latin-1", "replace")
              for l in texto.splitlines()[:4]: print("     |", l[:400])

          # Achado da primeira execução: o FNDE e o OpenDataSUS não têm mais
          # o CKAN (redirecionam; o dados.gov.br pede login), mas o Anexo 14 do
          # RREO no Tesouro traz os percentuais de educação, FUNDEB e saúde.
          # Agora: o Anexo 14 aparece no relatório simplificado? Em quantas
          # cidades de uma amostra variada? E a base de cálculo implícita
          # (valor ÷ percentual) bate com impostos e repasses do Anexo 3?
          API = "https://apidatalake.tesouro.gov.br/ords/siconfi/tt/rreo"
          TIPOS = ("RREO", "RREO Simplificado")
          AMOSTRA = ["3550308", "3304557", "2927408", "2304400", "4314902", "1721000",
                     "3101607", "3500105", "2100055", "2600054", "4300034", "3143104",
                     "3100104", "1700251", "5200050", "2200053", "1100015", "1501402"]
          TEMA = re.compile(r"ensino|fundeb|sa[uú]de", re.I)

          def anexo(ano, cod, tipo, nome):
              q = urllib.parse.urlencode({"an_exercicio": ano, "nr_periodo": 6, "co_tipo_demonstrativo": tipo,
                                          "no_anexo": nome, "co_esfera": "M", "id_ente": cod}, quote_via=urllib.parse.quote)
              url = f"{API}?{q}"
              if not permitido(url): return None
              st, _, _, corpo = baixar(url, "application/json")
              if st != 200: print(f"    {nome} {tipo}: HTTP {st}"); return None
              try: return json.loads(corpo.decode("utf-8")).get("items") or []
              except Exception: return None

          resumo = []
          for ano in (2025, 2024):
              for cod in AMOSTRA:
                  achado = None
                  for tipo in TIPOS:
                      itens = anexo(ano, cod, tipo, "RREO-Anexo 14")
                      if itens: achado = (tipo, itens); break
                  if not achado:
                      print(f"\n{ano} {cod}: sem Anexo 14 nos dois tipos"); resumo.append((ano, cod, "-", None, None, None)); continue
                  tipo, itens = achado
                  linhas = [i for i in itens if TEMA.search(i.get("conta") or "")]
                  print(f"\n{ano} {cod} ({tipo}): {len(itens)} linhas no Anexo 14, {len(linhas)} sobre ensino/FUNDEB/saúde")
                  vistos = set()
                  for i in linhas:
                      chave = (i.get("cod_conta"), i.get("coluna"))
                      if chave in vistos: continue
                      vistos.add(chave)
                      print(f"   {i.get('cod_conta')} | {(i.get('conta') or '')[:110]} | {i.get('coluna')} | {i.get('valor')}")
                  def valor(padrao_conta, padrao_coluna):
                      for i in linhas:
                          if re.search(padrao_conta, i.get("conta") or "", re.I) and re.search(padrao_coluna, i.get("coluna") or "", re.I):
                              return i.get("valor")
                      return None
                  mde_v, mde_p = valor(r"Manuten", r"Valor Apurado"), valor(r"Manuten", r"Aplicado")
                  sau_v, sau_p = valor(r"Sa[uú]de", r"Valor Apurado"), valor(r"Sa[uú]de", r"Aplicado")
                  # Base pelo Anexo 3: impostos próprios (sem taxas) e cotas
                  # constitucionais. Aproximada: confere a ordem de grandeza.
                  a3 = anexo(ano, cod, tipo, "RREO-Anexo 03") or []
                  col = [i for i in a3 if i.get("coluna") == "TOTAL (ÚLTIMOS 12 MESES)"]
                  pc = {i.get("cod_conta"): float(i.get("valor") or 0) for i in col}
                  contas = ("RREO3IPTU", "RREO3ISS", "RREO3ITBI", "RREO3IRRF", "RREO3CotaParteDoFPM",
                            "RREO3CotaParteDoICMS", "RREO3CotaParteDoIPVA", "RREO3CotaParteDoITR")
                  base3 = sum(pc.get(c, 0.0) for c in contas)
                  if not any(c in pc for c in contas[:2]):
                      print("   contas do Anexo 3:", sorted(k for k in pc if "IPTU" in k or "ISS" in k or "ITBI" in k or "IR" in k)[:12])
                  def razao(v, p):
                      return (float(v) / (float(p) / 100)) / base3 if v and p and base3 else None
                  rm, rs = razao(mde_v, mde_p), razao(sau_v, sau_p)
                  print(f"   MDE {mde_p}% (R$ {mde_v}); saúde {sau_p}% (R$ {sau_v}); base Anexo 3 R$ {base3:,.0f}; "
                        f"base implícita / Anexo 3: MDE {rm and round(rm, 3)}, saúde {rs and round(rs, 3)}")
                  resumo.append((ano, cod, tipo, mde_p, sau_p, rm))
          print("\nRESUMO (ano, cidade, tipo, % educação, % saúde, base implícita/Anexo 3):")
          for r in resumo: print("  ", r)
          PY

name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF e Excel) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python3 -m pip install --quiet openpyxl==3.1.5

      - name: Cota parlamentar, limites por estado (Câmara e Senado)
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/lim && cd /tmp/lim
          baixar() { curl -sSL --max-time 120 -A "ArrecadometroBrasil/1.0" -o "$2" -w "%{http_code} %{size_download} bytes %{content_type}\n" "$1" || echo "falhou"; }
          texto() {  # $1 arquivo; imprime texto puro
            case "$(file -b --mime-type "$1")" in
              application/pdf) pdftotext -layout "$1" - ;;
              *) python3 -c "import sys,html,re; t=open(sys.argv[1],'rb').read().decode('utf-8','replace'); t=re.sub(r'(?is)<(script|style).*?</\\1>',' ',t); t=re.sub(r'(?i)<br\\s*/?>|</(p|tr|li|div|h[1-6])>','\\n',t); t=re.sub(r'<[^>]+>',' ',t); print(html.unescape(t))" "$1" ;;
            esac
          }
          linhas_uf() {  # linhas com sigla de UF ou nome de estado e um valor em reais
            grep -n -E "(\b(AC|AL|AM|AP|BA|CE|DF|ES|GO|MA|MG|MS|MT|PA|PB|PE|PI|PR|RJ|RN|RO|RR|RS|SC|SE|SP|TO)\b|Acre|Alagoas|Amap|Amazonas|Bahia|Cear|Distrito Federal|Esp.rito Santo|Goi|Maranh|Mato Grosso|Minas|Par[aá]|Pernambuco|Piau|Rio de Janeiro|Rio Grande|Rond|Roraima|Santa Catarina|S.o Paulo|Sergipe|Tocantins).*[0-9]{1,3}\.[0-9]{3},[0-9]{2}" | sed 's/[[:space:]]\+/ /g' | head -80
          }
          echo "=== Câmara: Ato da Mesa 43/2009, norma atualizada"
          for url in \
            "https://www2.camara.leg.br/legin/int/atomes/2009/atodamesa-43-21-maio-2009-588364-normaatualizada-cd-mesa.html" \
            "https://www2.camara.leg.br/legin/int/atomes/2009/atodamesa-43-21-maio-2009-588364-normaatualizada-cd-mesa.pdf" \
            "https://www2.camara.leg.br/comunicacao/assessoria-de-imprensa/guia-para-jornalistas/cota-parlamentar"; do
            echo "--- $url"
            baixar "$url" doc
            texto doc > doc.txt
            wc -c doc.txt
            grep -n -i -E "anexo|reda..o dada|vig.ncia|a partir de|produz(ir)? efeitos|atualiza" doc.txt | sed 's/[[:space:]]\+/ /g' | tail -40
            linhas_uf < doc.txt
          done
          echo "=== Senado: tabela da transparência e normas"
          for url in \
            "https://www12.senado.leg.br/transparencia/leg/pdf/CotaExercicioAtivParlamSenadores.pdf" \
            "https://www12.senado.leg.br/transparencia/leg/pdf/normas/APS-5-2014-compilado.pdf" \
            "https://www12.senado.leg.br/institucional/documentos/seminarios/conhecendo-o-senado/pdfs/cotas-safin.pdf" \
            "https://www12.senado.leg.br/transparencia/perguntas-frequentes-1/sobre-os-senadores/o-que-e-ceaps"; do
            echo "--- $url"
            baixar "$url" doc
            texto doc > doc.txt
            wc -c doc.txt
            head -c 400 doc.txt | tr -s '[:space:]' ' '; echo
            grep -n -i -E "vig.ncia|a partir de|reajust|atualiza|ato d[ao]|exerc.cio de" doc.txt | sed 's/[[:space:]]\+/ /g' | head -30
            linhas_uf < doc.txt
          done

      - name: DIEESE, metodologia da cesta e do salário necessário
        continue-on-error: true
        run: |
          set -u
          for url in \
            https://www.dieese.org.br/metodologia/metodologiaCestaBasica2016.pdf \
            https://www.dieese.org.br/metodologia/metodologiaCestaBasica.pdf; do
            echo "=== $url"
            curl -sSfL --max-time 60 -A "ArrecadometroBrasil/1.0" "$url" -o /tmp/doc.pdf || { echo "falhou"; continue; }
            pdftotext -layout /tmp/doc.pdf /tmp/doc.txt
            grep -n -i -E -C 3 "adulto|criança|crianca|unidade.{0,20}consumo|necess[aá]rio|propor[cç][aã]o|35,|famil" /tmp/doc.txt | head -120
          done

      - name: IBGE, POF 2017-2018 (data de referência dos valores)
        continue-on-error: true
        run: |
          set -u
          for url in \
            https://biblioteca.ibge.gov.br/visualizacao/livros/liv101670.pdf; do
            echo "=== $url"
            curl -sSfL --max-time 120 -A "ArrecadometroBrasil/1.0" "$url" -o /tmp/pof.pdf || { echo "falhou"; continue; }
            pdftotext -layout /tmp/pof.pdf /tmp/pof.txt
            head -c 600 /tmp/pof.txt
            echo
            grep -n -i -E -C 2 "pre[cç]os de|deflacion|data de refer|15 de janeiro" /tmp/pof.txt | head -80
          done

      - name: FipeZAP, estrutura da planilha
        continue-on-error: true
        run: |
          set -u
          curl -sSfL --max-time 120 -A "ArrecadometroBrasil/1.0" \
            https://downloads.fipe.org.br/indices/fipezap/fipezap-serieshistoricas.xlsx -o /tmp/fipezap.xlsx
          sha256sum /tmp/fipezap.xlsx
          python3 - <<'PY'
          from openpyxl import load_workbook
          wb = load_workbook("/tmp/fipezap.xlsx", read_only=True, data_only=True)
          print("planilhas:", wb.sheetnames)
          for nome in wb.sheetnames[:3] + [n for n in wb.sheetnames if "BRASIL" in n.upper() or "INDICE" in n.upper()][:2]:
              ws = wb[nome]
              print(f"\n--- {nome} ({ws.max_row} linhas x {ws.max_column} colunas)")
              for i, linha in enumerate(ws.iter_rows(values_only=True)):
                  if i >= 14:
                      break
                  print(i + 1, [c for c in linha[:40]])
              ultimas = list(ws.iter_rows(min_row=max(1, ws.max_row - 2), values_only=True))
              for linha in ultimas:
                  print("fim", [c for c in linha[:40]])
          PY

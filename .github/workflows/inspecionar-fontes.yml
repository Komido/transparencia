name: Inspecionar fontes em PDF e Excel

# Tarefa manual, só de leitura: baixa arquivos que o banco não consegue ler
# (PDF e Excel) e mostra no registro da execução os trechos necessários para
# conferir regras e formatos antes de usar a fonte. Não grava nada no
# repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python3 -m pip install --quiet openpyxl==3.1.5

      - name: Lei 9.250/1995 (isenção do IR de 1996 a 2000)
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/lei && cd /tmp/lei
          curl -sSL --max-time 90 -A "Mozilla/5.0 (X11; Linux x86_64)" -o lei.html -w "%{http_code} %{size_download} bytes\n" \
            "https://www.planalto.gov.br/ccivil_03/leis/l9250.htm"
          python3 - lei.html <<'PY2'
          import html, re, sys
          bruto = open(sys.argv[1], "rb").read()
          for cod in ("utf-8", "cp1252"):
              try:
                  texto = bruto.decode(cod); break
              except UnicodeDecodeError:
                  continue
          texto = html.unescape(re.sub(r"<[^>]+>", " ", re.sub(r"(?is)<(script|style).*?</\1>", " ", texto)))
          linhas = [re.sub(r"\s+", " ", l).strip() for l in re.split(r"(?=Art\. ?\d)", texto)]
          for l in linhas:
              if l.startswith(("Art. 3", "Art. 4", "Art.3", "Art.4")) or re.search(r"10\.800|900,00", l):
                  print(l[:700]); print("---")
          PY2

      - name: Ipeadata, séries de arrecadação federal antes de 2000
        continue-on-error: true
        run: |
          set -u
          mkdir -p /tmp/ipea && cd /tmp/ipea
          for termo in "Arrecadação" "receitas federais" "Receita Federal"; do
            q=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "contains(SERNOME,'$termo')")
            curl -sSL --max-time 120 -o meta.json -w "%{http_code} %{size_download} bytes\n" \
              "http://www.ipeadata.gov.br/api/odata4/Metadados?\$filter=$q&\$select=SERCODIGO,SERNOME,FNTSIGLA,PERNOME,UNINOME,SERMINDATA,SERMAXDATA,SERSTATUS"
            python3 -c "
          import json
          d = json.load(open('meta.json'))
          for s in d.get('value', [])[:60]:
              print(s.get('SERCODIGO'), '|', s.get('SERNOME'), '|', s.get('FNTSIGLA'), '|', s.get('PERNOME'), '|', s.get('UNINOME'), '|', (s.get('SERMINDATA') or '')[:10], 'a', (s.get('SERMAXDATA') or '')[:10], '|', s.get('SERSTATUS'))
          " || head -c 400 meta.json
            echo "==="
          done


name: Converter aluguel do FipeZAP

# A Fipe publica o Índice FipeZAP só em Excel. Esta tarefa baixa a planilha
# oficial, converte para CSV (scripts/fipezap_para_csv.py) e grava em
# dados-fonte/fipezap/, com o SHA-256 do original. O banco coleta esse CSV
# depois, com as mesmas validações das outras fontes.
#
# Quem dispara é o agendador do banco (pg_cron, etl.disparar_github), todo dia às 05:57 de Brasília, antes da coleta das 06:41.
# O agendamento do próprio GitHub (schedule) nunca disparou neste repositório;
# ver supabase/migrations/20261116170000_disparo_github.sql.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gravar-no-repositorio
  cancel-in-progress: false

jobs:
  converter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar leitor de Excel
        run: python3 -m pip install --quiet openpyxl==3.1.5

      - name: Converter
        run: python3 scripts/fipezap_para_csv.py

      - name: Gravar se mudou
        run: |
          set -euo pipefail
          if git diff --quiet -- dados-fonte/fipezap && [ -z "$(git ls-files --others --exclude-standard dados-fonte/fipezap)" ]; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados-fonte/fipezap
          git commit -m "Atualiza aluguel do FipeZAP"
          git pull --rebase --quiet
          git push

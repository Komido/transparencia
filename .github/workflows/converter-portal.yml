name: Resumir o Portal da Transparência (cartão, despesa e viagens)
run-name: Resumir o Portal da Transparência (${{ inputs.periodo }})

# O Portal da Transparência (CGU) publica o cartão de pagamento do governo
# federal e a execução da despesa em arquivos mensais, e as viagens a serviço
# em um arquivo por ano. Esta tarefa baixa os arquivos oficiais, confere e
# resume por ano e órgão superior (scripts/portal_para_json.py) e grava o
# resumo em site/dados/portal/, com o SHA-256 de cada original em
# dados-fonte/portal/origem.json. O site lê só o resumo; nada passa pelo banco.
#
# Toda segunda-feira: ano corrente e anterior ("recentes"). No dia 2 de cada
# mês e quando rodada à mão: todos os anos, para pegar correções feitas depois.
#
# Quem dispara é o agendador do banco (pg_cron, etl.disparar_github), às segundas às 06:23 e no dia 2 às 06:41 de Brasília.
# O agendamento do próprio GitHub (schedule) nunca disparou neste repositório;
# ver supabase/migrations/20261116170000_disparo_github.sql.
#
# Uma parte por vez (viagens, cartão, ministérios), cada uma com seu tempo e
# gravando o próprio resultado: se uma falhar ou passar do tempo, as outras
# não se perdem. As partes rodam em sequência para respeitar o limite de
# pedidos do Portal.

on:
  workflow_dispatch:
    inputs:
      repeticao:
        description: "sim: repetição do dia seguinte; só roda se nada deu certo nas últimas 30 horas"
        required: false
        default: "nao"
      periodo:
        description: "Anos a refazer"
        type: choice
        options: [tudo, recentes]
        default: tudo

permissions:
  contents: write

concurrency:
  group: gravar-no-repositorio
  cancel-in-progress: false

jobs:
  # Repetição do dia seguinte (agendador do banco, repeticao=sim; ver
  # supabase/migrations/20261121010000_repeticao_mensal.sql): só segue se
  # nenhuma execução desta tarefa, com o mesmo título, deu certo nas últimas
  # 30 horas. Quando a do dia anterior passou, para aqui sem baixar nada dos
  # servidores do governo.
  conferir:
    if: ${{ inputs.repeticao == 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      ja_deu_certo: ${{ steps.ver.outputs.ja_deu_certo }}
    steps:
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          arquivo=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          desde=$(date -u -d '30 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          titulo=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .display_title) || titulo=""
          n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/$arquivo/runs" -f status=success -f per_page=30 \
              | jq --arg desde "$desde" --arg titulo "$titulo" \
                  '[.workflow_runs[] | select(.created_at >= $desde and .display_title == $titulo)] | length') || n=0
          if [ -n "$titulo" ] && [ "${n:-0}" -gt 0 ]; then
            echo "Deu certo $n vez(es) desde $desde; a repetição para aqui."
            echo "ja_deu_certo=sim" >> "$GITHUB_OUTPUT"
          else
            echo "Nada deu certo desde $desde; a repetição segue."
          fi

  resumir:
    needs: conferir
    if: ${{ !cancelled() && needs.conferir.outputs.ja_deu_certo != 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        base: [viagens, cartao, ministerios]
    steps:
      - uses: actions/checkout@v4

      - name: Pegar o que a parte anterior gravou
        run: git pull --rebase --quiet

      - name: Resumir
        env:
          PERIODO: ${{ github.event.inputs.periodo }}
          BASE: ${{ matrix.base }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ "${PERIODO:-}" = "recentes" ]; then
            python3 scripts/portal_para_json.py --recentes --so "$BASE"
          else
            python3 scripts/portal_para_json.py --so "$BASE"
          fi

      - name: Gravar se mudou
        env:
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          if git diff --quiet -- site/dados/portal dados-fonte/portal \
             && [ -z "$(git ls-files --others --exclude-standard site/dados/portal dados-fonte/portal)" ]; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/dados/portal dados-fonte/portal
          git commit -m "Atualiza resumo do Portal da Transparência ($BASE)"
          for k in 1 2 3 4; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((k * 10))
          done
          exit 1

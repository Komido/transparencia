name: Prefeitos e governadores eleitos (TSE)

# Lê nos dados abertos do TSE os prefeitos eleitos em 2020 e 2024 e os
# governadores eleitos em 2018, 2022 e 2026, liga cada cidade ao código do
# IBGE pela tabela oficial do TSE (scripts/governantes_para_json.py) e grava
# site/dados/governantes/UF.json. Nada passa pelo banco.
#
# Uma vez por mês basta: muda só com eleição suplementar ou correção do TSE.
# Quem dispara é o agendador do banco (pg_cron, etl.disparar_github); ver
# supabase/migrations/20261117020000_disparo_governantes.sql.

on:
  workflow_dispatch:
    inputs:
      repeticao:
        description: "sim: repetição do dia seguinte; só roda se nada deu certo nas últimas 30 horas"
        required: false
        default: "nao"

permissions:
  contents: write

concurrency:
  group: governantes
  cancel-in-progress: false

jobs:
  # Repetição do dia seguinte (agendador do banco, repeticao=sim; ver
  # supabase/migrations/20261121010000_repeticao_mensal.sql): só segue se
  # nenhuma execução desta tarefa, com o mesmo título, deu certo nas últimas
  # 30 horas. Quando a do dia anterior passou, para aqui sem baixar nada dos
  # servidores do governo.
  conferir:
    if: ${{ inputs.repeticao == 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      ja_deu_certo: ${{ steps.ver.outputs.ja_deu_certo }}
    steps:
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          arquivo=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          desde=$(date -u -d '30 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          titulo=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .display_title) || titulo=""
          n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/$arquivo/runs" -f status=success -f per_page=30 \
              | jq --arg desde "$desde" --arg titulo "$titulo" \
                  '[.workflow_runs[] | select(.created_at >= $desde and .display_title == $titulo)] | length') || n=0
          if [ -n "$titulo" ] && [ "${n:-0}" -gt 0 ]; then
            echo "Deu certo $n vez(es) desde $desde; a repetição para aqui."
            echo "ja_deu_certo=sim" >> "$GITHUB_OUTPUT"
          else
            echo "Nada deu certo desde $desde; a repetição segue."
          fi

  montar:
    needs: conferir
    if: ${{ !cancelled() && needs.conferir.outputs.ja_deu_certo != 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Ler os eleitos no TSE
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/governantes_para_json.py

      - name: Gravar se mudou
        run: |
          set -euo pipefail
          if git diff --quiet -- site/dados/governantes site/dados/vereadores site/dados/partidos.json \
             && [ -z "$(git ls-files --others --exclude-standard site/dados/governantes site/dados/vereadores site/dados/partidos.json)" ]; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/dados/governantes site/dados/vereadores site/dados/partidos.json
          git commit -q -m "Atualiza prefeitos e governadores eleitos (TSE)"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep $((i * 5))
          done
          exit 1

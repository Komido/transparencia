name: Câmaras municipais de SP, RS, PE e CE, em que gastaram (Tribunais de Contas)

# Baixa os arquivos anuais de despesas dos municípios dos Tribunais de Contas
# de SP (mais de 2 GB por ano) e do RS (1,4 GB por ano, com 10 segundos entre
# pedidos, como pede o robots.txt do portal), soma os pagamentos de cada
# câmara por tipo de despesa (scripts/camaras_sp_para_json.py e
# scripts/camaras_rs_para_json.py) e grava site/dados/camaras/UF.json. Sem
# nomes de pessoas. Só baixa de novo o ano cujo arquivo mudou; quando nada
# mudou, termina em poucos minutos. PE e CE vêm das APIs de dados abertos dos
# dois tribunais (scripts/camaras_pe_para_json.py, 12 consultas por ano, e
# scripts/camaras_ce_para_json.py, uma ou duas por cidade e ano): só o ano
# fechado mais recente é consultado de novo, e só até junho do ano seguinte.
# Um estado que falhar não impede os outros de gravar, mas a tarefa termina
# com erro para avisar. Na execução manual, "estados" escolhe quais rodar. Uma
# vez por mês, disparada pelo agendador do banco (pg_cron,
# etl.disparar_github); ver supabase/migrations/20261117060000_disparo_camaras.sql.

on:
  workflow_dispatch:
    inputs:
      estados:
        description: "Estados a atualizar, separados por espaço"
        required: false
        default: "SP RS PE CE"

permissions:
  contents: write

concurrency:
  group: camaras
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Somar os gastos das câmaras de SP
        if: ${{ contains(inputs.estados || 'SP RS PE CE', 'SP') }}
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/camaras_sp_para_json.py

      - name: Somar os gastos das câmaras do RS
        if: ${{ !cancelled() && contains(inputs.estados || 'SP RS PE CE', 'RS') }}
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/camaras_rs_para_json.py

      - name: Somar os gastos das câmaras de PE
        if: ${{ !cancelled() && contains(inputs.estados || 'SP RS PE CE', 'PE') }}
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/camaras_pe_para_json.py

      - name: Somar os gastos das câmaras do CE
        if: ${{ !cancelled() && contains(inputs.estados || 'SP RS PE CE', 'CE') }}
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/camaras_ce_para_json.py

      - name: Gravar se mudou
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if git diff --quiet -- site/dados/camaras \
             && [ -z "$(git ls-files --others --exclude-standard site/dados/camaras)" ]; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/dados/camaras
          git commit -q -m "Atualiza gastos das câmaras municipais"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep $((i * 5))
          done
          exit 1

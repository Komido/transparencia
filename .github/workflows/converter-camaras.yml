name: Câmaras municipais de SP, RS, PE, CE e PR, em que gastaram (Tribunais de Contas)

# Baixa os arquivos anuais de despesas dos municípios dos Tribunais de Contas
# de SP (mais de 2 GB por ano) e do RS (1,4 GB por ano, com 10 segundos entre
# pedidos, como pede o robots.txt do portal), soma os pagamentos de cada
# câmara por tipo de despesa (scripts/camaras_sp_para_json.py e
# scripts/camaras_rs_para_json.py) e grava site/dados/camaras/UF.json. Sem
# nomes de pessoas. Só baixa de novo o ano cujo arquivo mudou; quando nada
# mudou, termina em poucos minutos. PE e CE vêm das APIs de dados abertos dos
# dois tribunais (scripts/camaras_pe_para_json.py, 12 consultas por ano, e
# scripts/camaras_ce_para_json.py, uma ou duas por cidade e ano): só o ano
# fechado mais recente é consultado de novo, e só até junho do ano seguinte.
# PR vem do zip anual do TCE-PR (scripts/camaras_pr_para_json.py, 1,4 GB por
# ano), baixado de novo só se mudou e só até junho do ano seguinte.
# Um estado que falhar não impede os outros de gravar, mas a tarefa termina
# com erro para avisar. Na execução manual, "estados" escolhe quais rodar. Uma
# vez por mês, disparada pelo agendador do banco (pg_cron,
# etl.disparar_github); ver supabase/migrations/20261117060000_disparo_camaras.sql.

on:
  workflow_dispatch:
    inputs:
      repeticao:
        description: "sim: repetição do dia seguinte; só roda se nada deu certo nas últimas 30 horas"
        required: false
        default: "nao"
      estados:
        description: "Estados a atualizar, separados por espaço"
        required: false
        default: "SP RS PE CE PR"

permissions:
  contents: write

concurrency:
  group: camaras
  cancel-in-progress: false

jobs:
  # Repetição do dia seguinte (agendador do banco, repeticao=sim; ver
  # supabase/migrations/20261121010000_repeticao_mensal.sql): só segue se
  # nenhuma execução desta tarefa, com o mesmo título, deu certo nas últimas
  # 30 horas. Quando a do dia anterior passou, para aqui sem baixar nada dos
  # servidores do governo.
  conferir:
    if: ${{ inputs.repeticao == 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      ja_deu_certo: ${{ steps.ver.outputs.ja_deu_certo }}
    steps:
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          arquivo=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          desde=$(date -u -d '30 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          titulo=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .display_title) || titulo=""
          n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/$arquivo/runs" -f status=success -f per_page=30 \
              | jq --arg desde "$desde" --arg titulo "$titulo" \
                  '[.workflow_runs[] | select(.created_at >= $desde and .display_title == $titulo)] | length') || n=0
          if [ -n "$titulo" ] && [ "${n:-0}" -gt 0 ]; then
            echo "Deu certo $n vez(es) desde $desde; a repetição para aqui."
            echo "ja_deu_certo=sim" >> "$GITHUB_OUTPUT"
          else
            echo "Nada deu certo desde $desde; a repetição segue."
          fi

  montar:
    needs: conferir
    if: ${{ !cancelled() && needs.conferir.outputs.ja_deu_certo != 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Somar os gastos das câmaras de SP
        if: ${{ contains(inputs.estados || 'SP RS PE CE PR', 'SP') }}
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/camaras_sp_para_json.py

      - name: Somar os gastos das câmaras do RS
        if: ${{ !cancelled() && contains(inputs.estados || 'SP RS PE CE PR', 'RS') }}
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/camaras_rs_para_json.py

      - name: Somar os gastos das câmaras de PE
        if: ${{ !cancelled() && contains(inputs.estados || 'SP RS PE CE PR', 'PE') }}
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/camaras_pe_para_json.py

      - name: Somar os gastos das câmaras do CE
        if: ${{ !cancelled() && contains(inputs.estados || 'SP RS PE CE PR', 'CE') }}
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/camaras_ce_para_json.py

      - name: Somar os gastos das câmaras do PR
        if: ${{ !cancelled() && contains(inputs.estados || 'SP RS PE CE PR', 'PR') }}
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/camaras_pr_para_json.py

      - name: Gravar se mudou
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if git diff --quiet -- site/dados/camaras \
             && [ -z "$(git ls-files --others --exclude-standard site/dados/camaras)" ]; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/dados/camaras
          git commit -q -m "Atualiza gastos das câmaras municipais"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep $((i * 5))
          done
          exit 1

name: Resumir a cota parlamentar (Câmara e Senado)

# Câmara e Senado publicam as despesas da cota parlamentar em arquivos anuais
# (zip com CSV na Câmara, CSV no Senado). Esta tarefa baixa os arquivos
# oficiais, confere e resume por parlamentar, estado e tipo de despesa
# (scripts/cota_para_json.py) e grava o resumo em site/dados/cota/, com o
# SHA-256 de cada original em dados-fonte/cota/origem.json. O site lê só o
# resumo; nada passa pelo banco.
#
# De segunda a sábado: ano corrente e anterior ("recentes"). Aos domingos e
# quando rodada à mão: todos os anos desde 2019, para pegar correções feitas
# depois.
#
# Quem dispara é o agendador do banco (pg_cron, etl.disparar_github), todo dia às 05:37 de Brasília.
# O agendamento do próprio GitHub (schedule) nunca disparou neste repositório;
# ver supabase/migrations/20261116170000_disparo_github.sql.

on:
  workflow_dispatch:
    inputs:
      periodo:
        description: "Anos a refazer"
        type: choice
        options: [tudo, recentes]
        default: tudo

permissions:
  contents: write

concurrency:
  group: gravar-no-repositorio
  cancel-in-progress: false

jobs:
  resumir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resumir
        env:
          PERIODO: ${{ github.event.inputs.periodo }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ "${PERIODO:-}" = "recentes" ]; then
            python3 scripts/cota_para_json.py --recentes
          else
            python3 scripts/cota_para_json.py
          fi

      - name: Gravar se mudou
        run: |
          set -euo pipefail
          if git diff --quiet -- site/dados/cota dados-fonte/cota \
             && [ -z "$(git ls-files --others --exclude-standard site/dados/cota dados-fonte/cota)" ]; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/dados/cota dados-fonte/cota
          git commit -m "Atualiza resumo da cota parlamentar"
          git pull --rebase --quiet
          git push
